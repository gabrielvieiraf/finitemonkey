name: CI

on:
  push:
    branches: [main, next]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Título do PR em Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'; then
            echo "::error title=Título fora do padrão::O título vira a mensagem do squash e decide a versão. Use 'feat: ...' (versão menor), 'fix: ...' (correção) ou 'feat!: ...' (quebra). Exemplo: 'feat(init): detecta o gerenciador de pacotes'."
            exit 1
          fi

  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ${{ fromJSON(github.event_name == 'pull_request' && '[22]' || '[20, 22, 24]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run check
      - name: dist/ matches a fresh build
        run: npm run build && git diff --exit-code dist/
      - name: instruction files match the repository
        if: matrix.os == 'ubuntu-latest'
        run: node dist/finitemonkey.mjs instructions --strict
      - name: installed bins run from a prefix with spaces and accents
        run: npm run smoke:install
      - name: plugin validate --strict, mod footprint, mod load and claude plugin test
        if: matrix.os == 'ubuntu-latest' && matrix.node == fromJSON(github.event_name == 'pull_request' && '22' || '24')
        run: npm install --global @anthropic-ai/claude-code && npm run plugin:validate

  secret-engines:
    name: embedded secret rules agree with gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - name: install gitleaks (pinned, checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf "$archive" -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: same corpus, same result
        env:
          FM_REQUIRE_GITLEAKS: "1"
        run: node --import tsx --test test/secrets-gitleaks.test.ts

  look-browser:
    name: look tests with Playwright Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - name: install Playwright Chromium and its system libraries
        run: npx playwright-core install --with-deps chromium
      - name: browser-backed look tests run instead of skipping
        run: node --import tsx --test test/look*.test.ts test/doctor-browser.test.ts

  ci-gate:
    name: finitemonkey ci gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: same checks as the git hooks, on the pull request's commits
        run: node dist/finitemonkey.mjs ci gate

  supply-chain:
    name: supply chain and workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OSV_SCANNER_VERSION: 2.7.0
      OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: one lockfile per ecosystem and frozen installs
        run: node dist/finitemonkey.mjs deps check
      - name: the workflows of this repository pass ci audit with no finding
        run: |
          node dist/finitemonkey.mjs ci audit
          node dist/finitemonkey.mjs ci audit --json | jq -e '.data.findings | length == 0' > /dev/null
      - name: install osv-scanner (pinned, checksum verified)
        run: |
          binary="osv-scanner_linux_amd64"
          curl -sSfL -o "$binary" "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/${binary}"
          echo "${OSV_SCANNER_SHA256}  ${binary}" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && install -m 0755 "$binary" "$HOME/.local/bin/osv-scanner"
          rm "$binary"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: known vulnerabilities in the lockfile
        run: node dist/finitemonkey.mjs deps scan

  budgets:
    name: context and latency budgets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - name: context bytes and PreToolUse p95 per guard against budgets.json
        run: npm run budgets

  release:
    needs: [check, budgets]
    if: github.repository == 'gabrielvieiraf/finitemonkey' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      tag: ${{ steps.published.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm audit signatures
      - name: guard error rates against their budgets, written to bench/evidence.json and the README tables
        run: npm run evidence && npm run docs && npm run llms
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: Gabriel Vieira
          GIT_AUTHOR_EMAIL: 48156370+gabrielvieiraf@users.noreply.github.com
          GIT_COMMITTER_NAME: Gabriel Vieira
          GIT_COMMITTER_EMAIL: 48156370+gabrielvieiraf@users.noreply.github.com
      - name: the tag this run published, if any
        id: published
        run: echo "tag=$(git describe --exact-match --tags HEAD 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      - name: attach the CycloneDX SBOM to the release this run published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.published.outputs.tag }}
        run: |
          if [ -z "$tag" ]; then echo "no release published by this run"; exit 0; fi
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct HEAD)" npm run sbom -- --out finitemonkey.cdx.json
          gh release upload "$tag" finitemonkey.cdx.json --clobber
      - name: report issues closed by these commits but still open, empty milestones and stale docs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node dist/finitemonkey.mjs stale --after-merge

  binaries:
    name: standalone binary (${{ matrix.target }})
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-latest
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: windows-latest
            target: windows-x64
          - runner: windows-11-arm
            target: windows-arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - name: build the single executable and run --version and doctor --json with it
        run: npm run sea -- --smoke
      - name: archive name for this platform
        id: asset
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="$(npm run --silent sea -- --asset-name)"
          case "$name" in *"-${TARGET}."*) ;; *) echo "::error::$name is not the $TARGET archive"; exit 1 ;; esac
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: archive the binary as tar.gz
        if: runner.os != 'Windows'
        env:
          ASSET: ${{ steps.asset.outputs.name }}
        run: tar -czf "$ASSET" -C build/sea finitemonkey
      - name: archive the binary as zip
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET: ${{ steps.asset.outputs.name }}
        run: Compress-Archive -Path build/sea/finitemonkey.exe -DestinationPath $env:ASSET
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: ${{ steps.asset.outputs.name }}
          if-no-files-found: error
          retention-days: 1

  binary-manifests:
    name: SHA256SUMS and package manager manifests
    needs: [release, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: release-binaries
          merge-multiple: true
      - name: write SHA256SUMS and generate the Homebrew, Scoop and winget manifests from it
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          mkdir -p release-files
          (cd release-binaries && sha256sum finitemonkey-* > ../release-files/SHA256SUMS)
          cat release-files/SHA256SUMS
          npm run release:manifests -- --checksums release-files/SHA256SUMS --version "${TAG#v}" --out release-files/manifests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release-files
          if-no-files-found: error
          retention-days: 1

  binary-release:
    name: attest, sign and attach the binaries
    needs: [release, binary-manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: release-binaries
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files
      - name: the archives are the ones SHA256SUMS and the manifests list
        run: cd release-binaries && sha256sum -c ../release-files/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-binaries/finitemonkey-*
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: keyless Sigstore bundle for each archive
        run: |
          for archive in release-binaries/finitemonkey-*; do
            cosign sign-blob --yes --bundle "$archive.sigstore.json" "$archive"
          done
      - name: attach the archives, their bundles, SHA256SUMS and the manifests to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          mapfile -t manifests < <(find release-files/manifests -type f | sort)
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            release-binaries/finitemonkey-* release-files/SHA256SUMS "${manifests[@]}"
