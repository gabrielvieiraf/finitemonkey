name: Bug report
description: Something does not work as documented.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Security problem? Do not file it here. Follow SECURITY.md and report it privately.
        Never paste secrets, tokens or keys. Refer to them by file and line.
  - type: input
    id: version
    attributes:
      label: Finite Monkey version
      description: Output of `npx finitemonkey --version`.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
        - WSL
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node.js and Claude Code versions
      description: Output of `node --version` and `claude --version`.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Ask the agent to ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact error message.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `npx finitemonkey doctor --json`
      render: json
