</defs><rect x="0.0" y="0.0" width="976.0" height="532.8" fill="#fcfcfd" stroke="none" stroke-width="0"/><text x="24.0" y="34.0" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-size="20" fill="#121519" text-anchor="start" font-weight="600"><tspan x="24.0" dy="0.0">Measurement at three moments in the same person</tspan></text><line x1="24.0" y1="48.0" x2="952.0" y2="48.0" stroke="#e2e5e9" stroke-width="1"/><rect x="24.0" y="72.0" width="214.0" height="184.8" fill="#fcfcfd" stroke="#e2e5e9" stroke-width="1"/><rect x="24.0" y="72.0" width="214.0" height="3.0" fill="#2a7552" stroke="none" stroke-width="0"/><text x="38.0" y="98.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#2a7552" text-anchor="start" font-weight="700"><tspan x="38.0" dy="0.0">T0: baseline</tspan></text><line x1="38.0" y1="110.0" x2="224.0" y2="110.0" stroke="#e2e5e9" stroke-width="1"/><text x="38.0" y="130.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#121519" text-anchor="start" font-weight="400"><tspan x="38.0" dy="0.0">perceived competence P0</tspan><tspan x="38.0" dy="16.3">independent ceiling I0</tspan><tspan x="38.0" dy="16.3">discernment D0</tspan><tspan x="38.0" dy="16.3">domain knowledge</tspan><tspan x="38.0" dy="16.3">tool literacy</tspan><tspan x="38.0" dy="16.3">objective and perceived</tspan><tspan x="38.0" dy="16.3">difficulty, per item</tspan></text><line x1="241.0" y1="164.4" x2="258.0" y2="164.4" stroke="#121519" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="262.0" y="72.0" width="214.0" height="184.8" fill="#fcfcfd" stroke="#e2e5e9" stroke-width="1"/><rect x="262.0" y="72.0" width="214.0" height="3.0" fill="#2c5597" stroke="none" stroke-width="0"/><text x="276.0" y="98.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#2c5597" text-anchor="start" font-weight="700"><tspan x="276.0" dy="0.0">Assisted intervention</tspan></text><line x1="276.0" y1="110.0" x2="462.0" y2="110.0" stroke="#e2e5e9" stroke-width="1"/><text x="276.0" y="130.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.89" fill="#121519" text-anchor="start" font-weight="400"><tspan x="276.0" dy="0.0">use: accepted without attempt,</tspan><tspan x="276.0" dy="14.0">delegated steps</tspan><tspan x="276.0" dy="14.0">spontaneous questions</tspan><tspan x="276.0" dy="14.0">per item: why it is right</tspan><tspan x="276.0" dy="14.0">and when it stops being</tspan><tspan x="276.0" dy="14.0">right (proximal or blind)</tspan><tspan x="276.0" dy="14.0">error detection</tspan></text><line x1="479.0" y1="164.4" x2="496.0" y2="164.4" stroke="#121519" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="500.0" y="72.0" width="214.0" height="184.8" fill="#fcfcfd" stroke="#e2e5e9" stroke-width="1"/><rect x="500.0" y="72.0" width="214.0" height="3.0" fill="#7a5d2c" stroke="none" stroke-width="0"/><text x="514.0" y="98.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#7a5d2c" text-anchor="start" font-weight="700"><tspan x="514.0" dy="0.0">T1: no tool</tspan></text><line x1="514.0" y1="110.0" x2="700.0" y2="110.0" stroke="#e2e5e9" stroke-width="1"/><text x="514.0" y="130.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#121519" text-anchor="start" font-weight="400"><tspan x="514.0" dy="0.0">P1, I1, D1</tspan><tspan x="514.0" dy="16.3">attribution index</tspan></text><line x1="717.0" y1="164.4" x2="734.0" y2="164.4" stroke="#121519" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="738.0" y="72.0" width="214.0" height="184.8" fill="#fcfcfd" stroke="#e2e5e9" stroke-width="1"/><rect x="738.0" y="72.0" width="214.0" height="3.0" fill="#a8372b" stroke="none" stroke-width="0"/><text x="752.0" y="98.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#a8372b" text-anchor="start" font-weight="700"><tspan x="752.0" dy="0.0">T2: retention</tspan></text><line x1="752.0" y1="110.0" x2="938.0" y2="110.0" stroke="#e2e5e9" stroke-width="1"/><text x="752.0" y="130.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#121519" text-anchor="start" font-weight="400"><tspan x="752.0" dy="0.0">I2, D2 and transfer</tspan><tspan x="752.0" dy="16.3">parallel forms</tspan><tspan x="752.0" dy="16.3">perturbation: shifted</tspan><tspan x="752.0" dy="16.3">variant and deliberate</tspan><tspan x="752.0" dy="16.3">tool error</tspan><tspan x="752.0" dy="16.3">detection and repair</tspan></text><text x="726.0" y="278.8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#5d6570" text-anchor="middle" font-weight="700"><tspan x="726.0" dy="0.0">≥ 1 week</tspan></text><line x1="24.0" y1="306.8" x2="952.0" y2="306.8" stroke="#121519" stroke-width="1"/><text x="24.0" y="332.8" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-size="15" fill="#121519" text-anchor="start" font-weight="600"><tspan x="24.0" dy="0.0">Indices (modeled as latent variables)</tspan></text><text x="24.0" y="364.8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#2c5597" text-anchor="start" font-weight="700"><tspan x="24.0" dy="0.0">R = ΔP − ΔI</tspan></text><text x="253.5" y="364.8" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-size="14" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="253.5" dy="0.0">gap between what the person believes and what they can do</tspan></text><line x1="24.0" y1="376.8" x2="952.0" y2="376.8" stroke="#eceef1" stroke-width="1"/><text x="24.0" y="396.8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#2c5597" text-anchor="start" font-weight="700"><tspan x="24.0" dy="0.0">L = assisted − independent</tspan></text><text x="253.5" y="396.8" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-size="14" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="253.5" dy="0.0">width of the assisted zone</tspan></text><line x1="24.0" y1="408.8" x2="952.0" y2="408.8" stroke="#eceef1" stroke-width="1"/><text x="24.0" y="428.8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#2c5597" text-anchor="start" font-weight="700"><tspan x="24.0" dy="0.0">Bf = (assisted − D) / L</tspan></text><text x="253.5" y="428.8" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-size="14" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="253.5" dy="0.0">share of the zone that escapes judgment</tspan></text><line x1="24.0" y1="440.8" x2="952.0" y2="440.8" stroke="#eceef1" stroke-width="1"/><text x="24.0" y="460.8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#2c5597" text-anchor="start" font-weight="700"><tspan x="24.0" dy="0.0">Rep</tspan></text><text x="253.5" y="460.8" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-size="14" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="253.5" dy="0.0">repair under perturbation, separately for proximal and blind items</tspan></text><line x1="24.0" y1="472.8" x2="952.0" y2="472.8" stroke="#eceef1" stroke-width="1"/><text x="24.0" y="492.8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#2c5597" text-anchor="start" font-weight="700"><tspan x="24.0" dy="0.0">M = assisted / reference</tspan></text><text x="253.5" y="492.8" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-size="14" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="253.5" dy="0.0">share of a reference operator's performance; low M = horizon blindness</tspan></text><line x1="24.0" y1="504.8" x2="952.0" y2="504.8" stroke="#eceef1" stroke-width="1"/></svg>