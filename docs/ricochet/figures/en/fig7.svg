<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-label="Measurement at three moments in the same person"><title>Measurement at three moments in the same person</title><defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="8" height="8" fill="#fee2e2"/><line x1="0" y1="0" x2="0" y2="8" stroke="#dc2626" stroke-width="2.2"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs><rect x="0" y="0" width="960" height="570" fill="#ffffff" stroke="none" stroke-width="0" rx="0" /><text x="480.0" y="34" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan x="480.0" dy="0.0">Measurement at three moments in the same person</tspan></text><rect x="20" y="70" width="215" height="200" fill="#ffffff" stroke="#059669" stroke-width="1.8" rx="10" /><rect x="20" y="70" width="215" height="34" fill="#059669" stroke="none" stroke-width="0" rx="10" /><rect x="20" y="90" width="215" height="14" fill="#059669" stroke="none" stroke-width="0" rx="0" /><text x="127.5" y="93" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="127.5" dy="0.0">T0: baseline</tspan></text><text x="34" y="128" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="34" dy="0.0">perceived competence P0</tspan><tspan x="34" dy="15.6">independent ceiling I0</tspan><tspan x="34" dy="15.6">discernment D0</tspan><tspan x="34" dy="15.6">domain knowledge</tspan><tspan x="34" dy="15.6">tool literacy</tspan><tspan x="34" dy="15.6">objective and perceived</tspan><tspan x="34" dy="15.6">difficulty, per item</tspan></text><line x1="238" y1="170" x2="251" y2="170" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="255" y="70" width="215" height="200" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" rx="10" /><rect x="255" y="70" width="215" height="34" fill="#2563eb" stroke="none" stroke-width="0" rx="10" /><rect x="255" y="90" width="215" height="14" fill="#2563eb" stroke="none" stroke-width="0" rx="0" /><text x="362.5" y="93" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="362.5" dy="0.0">Assisted intervention</tspan></text><text x="269" y="128" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="269" dy="0.0">use: accepted without attempt,</tspan><tspan x="269" dy="15.6">delegated steps</tspan><tspan x="269" dy="15.6">spontaneous questions</tspan><tspan x="269" dy="15.6">per item: why it is right</tspan><tspan x="269" dy="15.6">and when it stops being</tspan><tspan x="269" dy="15.6">right (proximal or blind)</tspan><tspan x="269" dy="15.6">error detection</tspan></text><line x1="473" y1="170" x2="486" y2="170" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="490" y="70" width="215" height="200" fill="#ffffff" stroke="#d97706" stroke-width="1.8" rx="10" /><rect x="490" y="70" width="215" height="34" fill="#d97706" stroke="none" stroke-width="0" rx="10" /><rect x="490" y="90" width="215" height="14" fill="#d97706" stroke="none" stroke-width="0" rx="0" /><text x="597.5" y="93" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="597.5" dy="0.0">T1: no tool</tspan></text><text x="504" y="128" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="504" dy="0.0">P1, I1, D1</tspan><tspan x="504" dy="15.6">attribution index</tspan></text><line x1="708" y1="170" x2="721" y2="170" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="725" y="70" width="215" height="200" fill="#ffffff" stroke="#dc2626" stroke-width="1.8" rx="10" /><rect x="725" y="70" width="215" height="34" fill="#dc2626" stroke="none" stroke-width="0" rx="10" /><rect x="725" y="90" width="215" height="14" fill="#dc2626" stroke="none" stroke-width="0" rx="0" /><text x="832.5" y="93" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="832.5" dy="0.0">T2: retention</tspan></text><text x="739" y="128" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="739" dy="0.0">I2, D2 and transfer</tspan><tspan x="739" dy="15.6">parallel forms</tspan><tspan x="739" dy="15.6">perturbation: shifted</tspan><tspan x="739" dy="15.6">variant and deliberate</tspan><tspan x="739" dy="15.6">tool error</tspan><tspan x="739" dy="15.6">detection and repair</tspan></text><text x="717" y="296" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="bold"><tspan x="717" dy="0.0">≥ 1 week</tspan></text><rect x="20" y="330" width="920" height="220" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1" rx="10" /><text x="40" y="360" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold"><tspan x="40" dy="0.0">Indices (modeled as latent variables)</tspan></text><text x="40" y="392" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2563eb" text-anchor="start" font-weight="bold"><tspan x="40" dy="0.0">R = ΔP − ΔI</tspan></text><text x="250" y="392" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="250" dy="0.0">gap between what the person believes and what they can do</tspan></text><text x="40" y="422" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2563eb" text-anchor="start" font-weight="bold"><tspan x="40" dy="0.0">L = assisted − independent</tspan></text><text x="250" y="422" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="250" dy="0.0">width of the assisted zone</tspan></text><text x="40" y="452" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2563eb" text-anchor="start" font-weight="bold"><tspan x="40" dy="0.0">Bf = (assisted − D) / L</tspan></text><text x="250" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="250" dy="0.0">share of the zone that escapes judgment</tspan></text><text x="40" y="482" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2563eb" text-anchor="start" font-weight="bold"><tspan x="40" dy="0.0">Rep</tspan></text><text x="250" y="482" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="250" dy="0.0">repair under perturbation, separately for proximal and blind items</tspan></text><text x="40" y="512" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2563eb" text-anchor="start" font-weight="bold"><tspan x="40" dy="0.0">M = assisted / reference</tspan></text><text x="250" y="512" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="250" dy="0.0">share of a reference operator's performance; low M = horizon blindness</tspan></text></svg>