hat misses planted</tspan><tspan x="694" dy="15.6">bugs is decorative</tspan></text><rect x="360" y="350" width="240" height="190" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" rx="10" /><rect x="360" y="350" width="240" height="34" fill="#2563eb" stroke="none" stroke-width="0" rx="10" /><rect x="360" y="370" width="240" height="14" fill="#2563eb" stroke="none" stroke-width="0" rx="0" /><text x="480.0" y="373" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="480.0" dy="0.0">5. Record</tspan></text><text x="374" y="408" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="374" dy="0.0">blind band index</tspan><tspan x="374" dy="15.6">repair after approval</tspan><tspan x="374" dy="15.6">concept book</tspan><tspan x="374" dy="15.6">per domain, local only</tspan></text><rect x="40" y="350" width="240" height="190" fill="#ffffff" stroke="#059669" stroke-width="1.8" rx="10" /><rect x="40" y="350" width="240" height="34" fill="#059669" stroke="none" stroke-width="0" rx="10" /><rect x="40" y="370" width="240" height="14" fill="#059669" stroke="none" stroke-width="0" rx="0" /><text x="160.0" y="373" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="160.0" dy="0.0">6. The scaffold withdraws</tspan></text><text x="54" y="408" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="54" dy="0.0">prediction before the change</tspan><tspan x="54" dy="15.6">in a novice domain</tspan><tspan x="54" dy="15.6">concept demonstrated:</tspan><tspan x="54" dy="15.6">the prompt fades</tspan><tspan x="54" dy="15.6">later error: it returns</tspan></text><line x1="282" y1="175" x2="356" y2="175" stroke="#1f2937" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="602" y1="175" x2="676" y2="175" stroke="#1f2937" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="800" y1="272" x2="800" y2="346" stroke="#1f2937" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="676" y1="445" x2="604" y2="445" stroke="#1f2937" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="356" y1="445" x2="284" y2="445" stroke="#1f2937" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="160" y1="346" x2="160" y2="274" stroke="#1f2937" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="40" y="572" width="880" height="46" fill="#fef3c7" stroke="#d97706" stroke-width="1" rx="8" /><text x="480" y="601" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan x="480" dy="0.0">Rule: no horizon help goes out without a criterion the machine runs and the person understands.</tspan></text></svg>