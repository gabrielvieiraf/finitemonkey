, ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#121519" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">domain knowledge → moves the discernment ceiling</tspan></text><g transform="translate(88,312) rotate(-90)"><text x="0.0" y="0.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#121519" text-anchor="middle" font-weight="700"><tspan x="0.0" dy="0.0">tool literacy → moves the horizon</tspan></text></g><text x="804.0" y="92.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#6b7480" text-anchor="start" font-weight="700"><tspan x="804.0" dy="0.0">beyond the horizon: does not know to ask</tspan></text><rect x="816.0" y="100.5" width="10.0" height="10.0" fill="#eff1f4" stroke="#8a929c" stroke-width="0.6"/><text x="832.0" y="109.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="832.0" dy="0.0">out of reach</tspan></text><rect x="816.0" y="117.0" width="10.0" height="10.0" fill="#e3e6eb" stroke="#8a929c" stroke-width="0.6"/><text x="832.0" y="126.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="832.0" dy="0.0">would recognize if shown</tspan></text><text x="804.0" y="151.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#a8372b" text-anchor="start" font-weight="700"><tspan x="804.0" dy="0.0">blind band: neither produces nor judges</tspan></text><rect x="816.0" y="159.5" width="10.0" height="10.0" fill="url(#hatch)" stroke="#8a929c" stroke-width="0.6"/><text x="832.0" y="168.5" font-fam