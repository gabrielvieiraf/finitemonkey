="804.0" y="294.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#2a7552" text-anchor="start" font-weight="700"><tspan x="804.0" dy="0.0">what the person does alone</tspan></text><rect x="816.0" y="302.5" width="10.0" height="10.0" fill="#e4f2ea" stroke="#8a929c" stroke-width="0.6"/><text x="832.0" y="311.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="832.0" dy="0.0">redoes it in a known context</tspan></text><rect x="816.0" y="319.0" width="10.0" height="10.0" fill="#cfe7da" stroke="#8a929c" stroke-width="0.6"/><text x="832.0" y="328.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="832.0" dy="0.0">does it and transfers it</tspan></text></svg>