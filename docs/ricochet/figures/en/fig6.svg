', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#121519" text-anchor="middle" font-weight="700"><tspan x="409.8" dy="0.0">help without criterion</tspan></text><text x="409.8" y="520.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#a8372b" text-anchor="middle" font-weight="400"><tspan x="409.8" dy="0.0">The assisted ceiling rises,</tspan><tspan x="409.8" dy="16.1">discernment does not:</tspan><tspan x="409.8" dy="16.1">the blind band widens.</tspan></text><rect x="607.0" y="415.6" width="112.0" height="54.4" fill="#cfe7da" stroke="none" stroke-width="0"/><rect x="607.0" y="371.0" width="112.0" height="44.6" fill="#e4f2ea" stroke="none" stroke-width="0"/><rect x="607.0" y="291.8" width="112.0" height="79.2" fill="#cddbf2" stroke="none" stroke-width="0"/><rect x="607.0" y="247.2" width="112.0" height="44.6" fill="#e5ecf8" stroke="none" stroke-width="0"/><rect x="607.0" y="230.8" width="112.0" height="16.5" fill="#d9c6e8" stroke="none" stroke-width="0"/><rect x="607.0" y="207.7" width="112.0" height="23.1" fill="url(#dots)" stroke="none" stroke-width="0"/><rect x="607.0" y="173.0" width="112.0" height="34.7" fill="url(#hatch)" stroke="none" stroke-width="0"/><rect x="607.0" y="140.0" width="112.0" height="33.0" fill="#e3e6eb" stroke="none" stroke-width="0"/><rect x="607.0" y="107.0" width="112.0" height="33.0" fill="#eff1f4" stroke="none" stroke-width="0"/><line x1="607.0" y1="415.6" x2="719.0" y2="415.6" stroke="#121519" stroke-width="1" stroke-opacity="0.35"/><line x1="607.0" y1="371.0" x2="719.0" y2="371.0" stroke="#121519" stroke-width="1" stroke-opacity="0.35"/><line x1="607.0" y1="291.8" x2="719.0" y2="291.8" stroke="#121519" stroke-width="1" stroke-dasharray="2 3" stroke-opacity="0.18"/><line x1="607.0" y1="230.8" x2="719.0" y2="230.8" stroke="#121519" stroke-width="1" stroke-opacity="0.35"/><line x1="607.0" y1="207.7" x2="719.0" y2="207.7" stroke="#121519" stroke-width="1" stroke-dasharray="2 3" stroke-opacity="0.18"/><line x1="607.0" y1="173.0" x2="719.0" y2="173.0" stroke="#121519" stroke-width="1" stroke-opacity="0.35"/><line x1="607.0" y1="140.0" x2="719.0" y2="140.0" stroke="#121519" stroke-width="1" stroke-dasharray="2 3" stroke-opacity="0.18"/><rect x="607.0" y="107.0" width="112.0" height="363.0" fill="none" stroke="#121519" stroke-width="0.6" stroke-opacity="0.35"/><text x="663.0" y="496.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#121519" text-anchor="middle" font-weight="700"><tspan x="663.0" dy="0.0">help with executable criterion</tspan></text><text x="663.0" y="520.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#2a7552" text-anchor="middle" font-weight="400"><tspan x="663.0" dy="0.0">The same ceiling gain, with</tspan><tspan x="663.0" dy="16.1">part of the horizon turned</tspan><tspan x="663.0" dy="16.1">into discernment.</tspan></text><line x1="70.6" y1="470.0" x2="749.0" y2="470.0" stroke="#121519" stroke-width="1"/><text x="813.6" y="110.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#6b7480" text-anchor="start" font-weight="700"><tspan x="813.6" dy="0.0">beyond the horizon: does not know to ask</tspan></text><rect x="825.6" y="118.5" width="10.0" height="10.0" fill="#eff1f4" stroke="#8a929c" stroke-width="0.6"/><text x="841.6" y="127.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="841.6" dy="0.0">out of reach</tspan></text><rect x="825.6" y="135.0" width="10.0" height="10.0" fill="#e3e6eb" stroke="#8a929c" stroke-width="0.6"/><text x="841.6" y="144.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="841.6" dy="0.0">would recognize if shown</tspan></text><text x="813.6" y="169.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#a8372b" text-anchor="start" font-weight="700"><tspan x="813.6" dy="0.0">blind band: neither produces nor judges</tspan></text><rect x="825.6" y="177.5" width="10.0" height="10.0" fill="url(#hatch)" stroke="#8a929c" stroke-width="0.6"/><text x="841.6" y="186.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="841.6" dy="0.0">receives without criterion</tspan></text><rect x="825.6" y="194.0" width="10.0" height="10.0" fill="url(#dots)" stroke="#8a929c" stroke-width="0.6"/><text x="841.6" y="203.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="841.6" dy="0.0">receives with criterion</tspan></text><rect x="813.6" y="219.0" width="10.0" height="10.0" fill="#d9c6e8" stroke="#8a929c" stroke-width="0.6"/><text x="829.6" y="228.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#6b4a8c" text-anchor="start" font-weight="700"><tspan x="829.6" dy="0.0">unstable boundary</tspan></text><text x="813.6" y="253.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#2c5597" text-anchor="start" font-weight="700"><tspan x="813.6" dy="0.0">proximal band: still judges</tspan></text><rect x="825.6" y="261.5" width="10.0" height="10.0" fill="#e5ecf8" stroke="#8a929c" stroke-width="0.6"/><text x="841.6" y="270.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="841.6" dy="0.0">detects without explaining</tspan></text><rect x="825.6" y="278.0" width="10.0" height="10.0" fill="#cddbf2" stroke="#8a929c" stroke-width="0.6"/><text x="841.6" y="287.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="841.6" dy="0.0">judges and explains</tspan></text><text x="813.6" y="312.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#2a7552" text-anchor="start" font-weight="700"><tspan x="813.6" dy="0.0">what the person does alone</tspan></text><rect x="825.6" y="320.5" width="10.0" height="10.0" fill="#e4f2ea" stroke="#8a929c" stroke-width="0.6"/><text x="841.6" y="329.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="841.6" dy="0.0">redoes it in a known context</tspan></text><rect x="825.6" y="337.0" width="10.0" height="10.0" fill="#cfe7da" stroke="#8a929c" stroke-width="0.6"/><text x="841.6" y="346.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="841.6" dy="0.0">does it and transfers it</tspan></text></svg>