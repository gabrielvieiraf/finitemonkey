 stroke-opacity="0.35"/><line x1="299.6" y1="146.8" x2="469.6" y2="146.8" stroke="#121519" stroke-width="1" stroke-dasharray="2 3" stroke-opacity="0.18"/><rect x="299.6" y="98.4" width="170.0" height="457.6" fill="none" stroke="#121519" stroke-width="0.6" stroke-opacity="0.35"/><line x1="289.6" y1="98.4" x2="299.6" y2="98.4" stroke="#121519" stroke-width="1"/><text x="283.6" y="102.4" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#121519" text-anchor="end" font-weight="400"><tspan x="283.6" dy="0.0">techo tecnológico</tspan></text><line x1="289.6" y1="195.2" x2="299.6" y2="195.2" stroke="#121519" stroke-width="1"/><text x="283.6" y="199.2" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#121519" text-anchor="end" font-weight="400"><tspan x="283.6" dy="0.0">techo asistido</tspan><tspan x="283.6" dy="15.5">(frontera de la exploración)</tspan></text><line x1="289.6" y1="336.0" x2="299.6" y2="336.0" stroke="#121519" stroke-width="1"/><text x="283.6" y="340.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#121519" text-anchor="end" font-weight="400"><tspan x="283.6" dy="0.0">techo de discernimiento</tspan><tspan x="283.6" dy="15.5">(frontera del juicio)</tspan></text><line x1="289.6" y1="459.2" x2="299.6" y2="459.2" stroke="#121519" stroke-width="1"/><text x="283.6" y="463.2" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#121519" text-anchor="end" font-weight="400"><tspan x="283.6" dy="0.0">techo independiente</tspan></text><path d="M 62 196.2 L 54 196.2 L 54 458.2 L 62 458.2" fill="none" stroke="#121519" stroke-width="1.2"/><g transform="translate(46,327.2) rotate(-90)"><text x="0.0" y="0.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#121519" text-anchor="middle" font-weight="700"><tspan x="0.0" dy="0.0">zona asistida</tspan></text></g><path d="M 472.64 99.4 L 477.64 99.4 L 477.64 194.2 L 472.64 194.2" fill="none" stroke="#6b7480" stroke-width="1.2"/><path d="M 477.64 146.8 L 519.64 121.8" fill="none" stroke="#6b7480" stroke-width="0.8" stroke-opacity="0.6"/><text x="525.6" y="125.8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#6b7480" text-anchor="start" font-weight="700"><tspan x="525.6" dy="0.0">Más allá del horizonte: la herramienta podría</tspan><tspan x="525.6" dy="14.9">darlo, pero la persona no sabe pedirlo</tspan></text><rect x="537.6" y="149.1" width="10.0" height="10.0" fill="#eff1f4" stroke="#8a929c" stroke-width="0.6"/><text x="553.6" y="158.1" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="553.6" dy="0.0">fuera de alcance</tspan></text><rect x="537.6" y="165.6" width="10.0" height="10.0" fill="#e3e6eb" stroke="#8a929c" stroke-width="0.6"/><text x="553.6" y="174.6" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="553.6" dy="0.0">lo reconocería si se lo muestran</tspan></text><path d="M 472.64 196.2 L 477.64 196.2 L 477.64 324.0 L 472.64 324.0" fill="none" stroke="#a8372b" stroke-width="1.2"/><path d="M 477.64 260.1 L 519.64 235.1" fill="none" stroke="#a8372b" stroke-width="0.8" stroke-opacity="0.6"/><text x="525.6" y="239.1" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#a8372b" text-anchor="start" font-weight="700"><tspan x="525.6" dy="0.0">Franja ciega: la persona lo obtiene,</tspan><tspan x="525.6" dy="14.9">pero ni lo produce ni lo juzga</tspan></text><rect x="537.6" y="262.5" width="10.0" height="10.0" fill="url(#hatch)" stroke="#8a929c" stroke-width="0.6"/><text x="553.6" y="271.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="553.6" dy="0.0">recibe sin criterio</tspan></text><rect x="537.6" y="279.0" width="10.0" height="10.0" fill="url(#dots)" stroke="#8a929c" stroke-width="0.6"/><text x="553.6" y="288.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="553.6" dy="0.0">recibe con criterio</tspan></text><path d="M 477.64 336.0 L 519.64 335.0" fill="none" stroke="#6b4a8c" stroke-width="0.8" stroke-opacity="0.6"/><rect x="525.6" y="330.0" width="10.0" height="10.0" fill="#d9c6e8" stroke="#8a929c" stroke-width="0.6"/><text x="541.6" y="339.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#6b4a8c" text-anchor="start" font-weight="700"><tspan x="541.6" dy="0.0">frontera inestable</tspan></text><path d="M 472.64 348.0 L 477.64 348.0 L 477.64 458.2 L 472.64 458.2" fill="none" stroke="#2c5597" stroke-width="1.2"/><path d="M 477.64 403.1 L 519.64 378.1" fill="none" stroke="#2c5597" stroke-width="0.8" stroke-opacity="0.6"/><text x="525.6" y="382.1" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#2c5597" text-anchor="start" font-weight="700"><tspan x="525.6" dy="0.0">Franja proximal: no produce</tspan><tspan x="525.6" dy="14.9">sola, pero todavía juzga</tspan></text><rect x="537.6" y="405.5" width="10.0" height="10.0" fill="#e5ecf8" stroke="#8a929c" stroke-width="0.6"/><text x="553.6" y="414.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="553.6" dy="0.0">detecta sin explicar</tspan></text><rect x="537.6" y="422.0" width="10.0" height="10.0" fill="#cddbf2" stroke="#8a929c" stroke-width="0.6"/><text x="553.6" y="431.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="553.6" dy="0.0">juzga y explica</tspan></text><path d="M 472.64 460.2 L 477.64 460.2 L 477.64 555.0 L 472.64 555.0" fill="none" stroke="#2a7552" stroke-width="1.2"/><path d="M 477.64 507.6 L 519.64 490.6" fill="none" stroke="#2a7552" stroke-width="0.8" stroke-opacity="0.6"/><text x="525.6" y="494.6" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#2a7552" text-anchor="start" font-weight="700"><tspan x="525.6" dy="0.0">Competencia independiente</tspan></text><rect x="537.6" y="503.1" width="10.0" height="10.0" fill="#e4f2ea" stroke="#8a929c" stroke-width="0.6"/><text x="553.6" y="512.1" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="553.6" dy="0.0">lo rehace en contexto conocido</tspan></text><rect x="537.6" y="519.6" width="10.0" height="10.0" fill="#cfe7da" stroke="#8a929c" stroke-width="0.6"/><text x="553.6" y="528.6" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="553.6" dy="0.0">lo hace y lo transfiere</tspan></text></svg>