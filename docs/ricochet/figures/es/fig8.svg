<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-label="Finite Monkey como intervención e instrumento"><title>Finite Monkey como intervención e instrumento</title><defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="8" height="8" fill="#fee2e2"/><line x1="0" y1="0" x2="0" y2="8" stroke="#dc2626" stroke-width="2.2"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs><rect x="0" y="0" width="960" height="640" fill="#ffffff" stroke="none" stroke-width="0" rx="0" /><text x="480.0" y="34" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan x="480.0" dy="0.0">Finite Monkey como intervención e instrumento</tspan></text><rect x="40" y="80" width="240" height="190" fill="#ffffff" stroke="#6b7280" stroke-width="1.8" rx="10" /><rect x="40" y="80" width="240" height="34" fill="#6b7280" stroke="none" stroke-width="0" rx="10" /><rect x="40" y="100" width="240" height="14" fill="#6b7280" stroke="none" stroke-width="0" rx="0" /><text x="160.0" y="103" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="160.0" dy="0.0">1. Señales de la sesión</tspan></text><text x="54" y="138" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="54" dy="0.0">el mismo error que vuelve</tspan><tspan x="54" dy="15.6">contrato sin avance</tspan><tspan x="54" dy="15.6">preguntas de superficie</tspan><tspan x="54" dy="15.6">aprobación rápida de un diff</tspan><tspan x="54" dy="15.6">grande; perfil por dominio</tspan></text><rect x="360" y="80" width="240" height="190" fill="#ffffff" stroke="#d97706" stroke-width="1.8" rx="10" /><rect x="360" y="80" width="240" height="34" fill="#d97706" stroke="none" stroke-width="0" rx="10" /><rect x="360" y="100" width="240" height="14" fill="#d97706" stroke="none" stroke-width="0" rx="0" /><text x="480.0" y="103" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="480.0" dy="0.0">2. Hipótesis de frontera</tspan></text><text x="374" y="138" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="374" dy="0.0">exploración: no sabe</tspan><tspan x="374" dy="15.6">qué pedir</tspan><tspan x="374" dy="15.6">juicio: no puede evaluar</tspan><tspan x="374" dy="15.6">lo que recibió</tspan><tspan x="374" dy="15.6">las dos: juicio primero</tspan></text><rect x="680" y="80" width="240" height="190" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" rx="10" /><rect x="680" y="80" width="240" height="34" fill="#2563eb" stroke="none" stroke-width="0" rx="10" /><rect x="680" y="100" width="240" height="14" fill="#2563eb" stroke="none" stroke-width="0" rx="0" /><text x="800.0" y="103" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="800.0" dy="0.0">3. Remedio</tspan></text><text x="694" y="138" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="694" dy="0.0">exploración: preguntar solo</tspan><tspan x="694" dy="15.6">donde las candidatas divergen</tspan><tspan x="694" dy="15.6">(A hace X, B hace Y)</tspan><tspan x="694" dy="15.6">juicio: contrato de</tspan><tspan x="694" dy="15.6">comportamiento, prueba que</tspan><tspan x="694" dy="15.6">la persona puede leer</tspan></text><rect x="680" y="350" width="240" height="190" fill="#ffffff" stroke="#059669" stroke-width="1.8" rx="10" /><rect x="680" y="350" width="240" height="34" fill="#059669" stroke="none" stroke-width="0" rx="10" /><rect x="680" y="370" width="240" height="14" fill="#059669" stroke="none" stroke-width="0" rx="0" /><text x="800.0" y="373" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="800.0" dy="0.0">4. Criterio ejecutable</tspan></text><text x="694" y="408" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="694" dy="0.0">ejemplos aprobados por la</tspan><tspan x="694" dy="15.6">persona, fijados por hash</tspan><tspan x="694" dy="15.6">portón verde en el estado</tspan><tspan x="694" dy="15.6">exacto de los archivos</tspan><tspan x="694" dy="15.6">criterio que no detecta un</tspan><tspan x="694" dy="15.6">defecto sembrado: decorativo</tspan></text><rect x="360" y="350" width="240" height="190" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" rx="10" /><rect x="360" y="350" width="240" height="34" fill="#2563eb" stroke="none" stroke-width="0" rx="10" /><rect x="360" y="370" width="240" height="14" fill="#2563eb" stroke="none" stroke-width="0" rx="0" /><text x="480.0" y="373" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="480.0" dy="0.0">5. Registro</tspan></text><text x="374" y="408" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="374" dy="0.0">índice de franja ciega</tspan><tspan x="374" dy="15.6">reparación tras la aprobación</tspan><tspan x="374" dy="15.6">libro de conceptos</tspan><tspan x="374" dy="15.6">por dominio, solo local</tspan></text><rect x="40" y="350" width="240" height="190" fill="#ffffff" stroke="#059669" stroke-width="1.8" rx="10" /><rect x="40" y="350" width="240" height="34" fill="#059669" stroke="none" stroke-width="0" rx="10" /><rect x="40" y="370" width="240" height="14" fill="#059669" stroke="none" stroke-width="0" rx="0" /><text x="160.0" y="373" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="160.0" dy="0.0">6. El andamio se retira</tspan></text><text x="54" y="408" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="54" dy="0.0">predicción antes del cambio</tspan><tspan x="54" dy="15.6">en un dominio novato</tspan><tspan x="54" dy="15.6">concepto demostrado:</tspan><tspan x="54" dy="15.6">la exigencia desaparece</tspan><tspan x="54" dy="15.6">error después: vuelve</tspan></text><line x1="282" y1="175" x2="356" y2="175" stroke="#1f2937" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="602" y1="175" x2="676" y2="175" stroke="#1f2937" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="800" y1="272" x2="800" y2="346" stroke="#1f2937" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="676" y1="445" x2="604" y2="445" stroke="#1f2937" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="356" y1="445" x2="284" y2="445" stroke="#1f2937" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="160" y1="346" x2="160" y2="274" stroke="#1f2937" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="40" y="572" width="880" height="46" fill="#fef3c7" stroke="#d97706" stroke-width="1" rx="8" /><text x="480" y="601" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan x="480" dy="0.0">Regla: ninguna ayuda de horizonte sale sin un criterio que la máquina ejecuta y la persona entiende.</tspan></text></svg>