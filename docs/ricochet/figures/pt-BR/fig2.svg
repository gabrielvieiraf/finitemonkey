<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="A zona assistida e suas duas fronteiras"><title>A zona assistida e suas duas fronteiras</title><defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="8" height="8" fill="#fee2e2"/><line x1="0" y1="0" x2="0" y2="8" stroke="#dc2626" stroke-width="2.2"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs><rect x="0" y="0" width="960" height="600" fill="#ffffff" stroke="none" stroke-width="0" rx="0" /><text x="480.0" y="34" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan x="480.0" dy="0.0">A zona assistida e suas duas fronteiras</tspan></text><rect x="330" y="61.60000000000002" width="220" height="101.19999999999999" fill="#d1d5db" stroke="none" stroke-width="0" rx="0" /><rect x="330" y="162.8" width="220" height="147.2" fill="url(#hatch)" stroke="none" stroke-width="0" rx="0" /><rect x="330" y="310.0" width="220" height="128.8" fill="#dbeafe" stroke="none" stroke-width="0" rx="0" /><rect x="330" y="438.8" width="220" height="101.19999999999999" fill="#d1fae5" stroke="none" stroke-width="0" rx="0" /><line x1="330" y1="438.8" x2="550" y2="438.8" stroke="#059669" stroke-width="2.5"/><line x1="330" y1="310.0" x2="550" y2="310.0" stroke="#d97706" stroke-width="2.5"/><line x1="330" y1="162.8" x2="550" y2="162.8" stroke="#2563eb" stroke-width="2.5"/><rect x="330" y="61.60000000000002" width="220" height="478.4" fill="none" stroke="#1f2937" stroke-width="1" rx="0" /><line x1="312" y1="61.60000000000002" x2="330" y2="61.60000000000002" stroke="#9ca3af" stroke-width="2.5"/><text x="304" y="66.60000000000002" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#9ca3af" text-anchor="end" font-weight="bold"><tspan x="304" dy="0.0">teto tecnológico</tspan></text><line x1="312" y1="162.8" x2="330" y2="162.8" stroke="#2563eb" stroke-width="2.5"/><text x="304" y="167.8" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2563eb" text-anchor="end" font-weight="bold"><tspan x="304" dy="0.0">teto assistido</tspan><tspan x="304" dy="16.2">(fronteira da exploração)</tspan></text><line x1="312" y1="310.0" x2="330" y2="310.0" stroke="#d97706" stroke-width="2.5"/><text x="304" y="315.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#d97706" text-anchor="end" font-weight="bold"><tspan x="304" dy="0.0">teto de discernimento</tspan><tspan x="304" dy="16.2">(fronteira do julgamento)</tspan></text><line x1="312" y1="438.8" x2="330" y2="438.8" stroke="#059669" stroke-width="2.5"/><text x="304" y="443.8" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#059669" text-anchor="end" font-weight="bold"><tspan x="304" dy="0.0">teto independente</tspan></text><text x="612" y="106.20000000000005" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="612" dy="0.0">Além do horizonte: a ferramenta poderia</tspan><tspan x="612" dy="16.2">dar, mas a pessoa não sabe pedir</tspan></text><text x="612" y="230.40000000000003" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="612" dy="0.0">Faixa cega: a pessoa obtém,</tspan><tspan x="612" dy="16.2">mas não produz nem julga</tspan></text><text x="612" y="368.4" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="612" dy="0.0">Faixa proximal: não produz</tspan><tspan x="612" dy="16.2">sozinha, mas ainda julga</tspan></text><text x="612" y="483.4" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="612" dy="0.0">Competência independente</tspan></text><path d="M 558 162.8 q 8 0 8 8 L 566 430.8 q 0 8 -8 8" fill="none" stroke="#1f2937" stroke-width="1.5"/><g transform="translate(592,300.8) rotate(-90)"><text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan x="0" dy="0.0">zona assistida</tspan></text></g></svg>