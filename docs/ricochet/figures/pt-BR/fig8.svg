<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-label="O Finite Monkey como intervenção e instrumento"><title>O Finite Monkey como intervenção e instrumento</title><defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="8" height="8" fill="#fee2e2"/><line x1="0" y1="0" x2="0" y2="8" stroke="#dc2626" stroke-width="2.2"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs><rect x="0" y="0" width="960" height="640" fill="#ffffff" stroke="none" stroke-width="0" rx="0" /><text x="480.0" y="34" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan x="480.0" dy="0.0">O Finite Monkey como intervenção e instrumento</tspan></text><rect x="40" y="80" width="240" height="190" fill="#ffffff" stroke="#6b7280" stroke-width="1.8" rx="10" /><rect x="40" y="80" width="240" height="34" fill="#6b7280" stroke="none" stroke-width="0" rx="10" /><rect x="40" y="100" width="240" height="14" fill="#6b7280" stroke="none" stroke-width="0" rx="0" /><text x="160.0" y="103" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="160.0" dy="0.0">1. Sinais da sessão</tspan></text><text x="54" y="138" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="54" dy="0.0">mesmo erro voltando</tspan><tspan x="54" dy="15.6">contrato sem progresso</tspan><tspan x="54" dy="15.6">perguntas de superfície</tspan><tspan x="54" dy="15.6">aceite rápido de diff grande</tspan><tspan x="54" dy="15.6">perfil por domínio</tspan></text><rect x="360" y="80" width="240" height="190" fill="#ffffff" stroke="#d97706" stroke-width="1.8" rx="10" /><rect x="360" y="80" width="240" height="34" fill="#d97706" stroke="none" stroke-width="0" rx="10" /><rect x="360" y="100" width="240" height="14" fill="#d97706" stroke="none" stroke-width="0" rx="0" /><text x="480.0" y="103" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="480.0" dy="0.0">2. Hipótese de fronteira</tspan></text><text x="374" y="138" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="374" dy="0.0">exploração: não sabe o</tspan><tspan x="374" dy="15.6">que pedir</tspan><tspan x="374" dy="15.6">julgamento: não consegue</tspan><tspan x="374" dy="15.6">avaliar o que recebeu</tspan><tspan x="374" dy="15.6">as duas: julgamento primeiro</tspan></text><rect x="680" y="80" width="240" height="190" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" rx="10" /><rect x="680" y="80" width="240" height="34" fill="#2563eb" stroke="none" stroke-width="0" rx="10" /><rect x="680" y="100" width="240" height="14" fill="#2563eb" stroke="none" stroke-width="0" rx="0" /><text x="800.0" y="103" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="800.0" dy="0.0">3. Remédio</tspan></text><text x="694" y="138" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="694" dy="0.0">exploração: pergunta só onde</tspan><tspan x="694" dy="15.6">as candidatas divergem</tspan><tspan x="694" dy="15.6">(A faz X, B faz Y)</tspan><tspan x="694" dy="15.6">julgamento: contrato de</tspan><tspan x="694" dy="15.6">comportamento, prova que</tspan><tspan x="694" dy="15.6">a pessoa consegue ler</tspan></text><rect x="680" y="350" width="240" height="190" fill="#ffffff" stroke="#059669" stroke-width="1.8" rx="10" /><rect x="680" y="350" width="240" height="34" fill="#059669" stroke="none" stroke-width="0" rx="10" /><rect x="680" y="370" width="240" height="14" fill="#059669" stroke="none" stroke-width="0" rx="0" /><text x="800.0" y="373" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="800.0" dy="0.0">4. Critério executável</tspan></text><text x="694" y="408" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="694" dy="0.0">exemplos aprovados pela</tspan><tspan x="694" dy="15.6">pessoa, presos por hash</tspan><tspan x="694" dy="15.6">portão verde no estado exato</tspan><tspan x="694" dy="15.6">dos arquivos</tspan><tspan x="694" dy="15.6">critério que não pega defeito</tspan><tspan x="694" dy="15.6">plantado é decorativo</tspan></text><rect x="360" y="350" width="240" height="190" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" rx="10" /><rect x="360" y="350" width="240" height="34" fill="#2563eb" stroke="none" stroke-width="0" rx="10" /><rect x="360" y="370" width="240" height="14" fill="#2563eb" stroke="none" stroke-width="0" rx="0" /><text x="480.0" y="373" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="480.0" dy="0.0">5. Registro</tspan></text><text x="374" y="408" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="374" dy="0.0">índice de faixa cega</tspan><tspan x="374" dy="15.6">reparação depois do aceite</tspan><tspan x="374" dy="15.6">livro de conceitos</tspan><tspan x="374" dy="15.6">por domínio, só local</tspan></text><rect x="40" y="350" width="240" height="190" fill="#ffffff" stroke="#059669" stroke-width="1.8" rx="10" /><rect x="40" y="350" width="240" height="34" fill="#059669" stroke="none" stroke-width="0" rx="10" /><rect x="40" y="370" width="240" height="14" fill="#059669" stroke="none" stroke-width="0" rx="0" /><text x="160.0" y="373" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="160.0" dy="0.0">6. O andaime se retira</tspan></text><text x="54" y="408" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="54" dy="0.0">previsão antes da mudança</tspan><tspan x="54" dy="15.6">em domínio novato</tspan><tspan x="54" dy="15.6">conceito demonstrado:</tspan><tspan x="54" dy="15.6">a exigência some</tspan><tspan x="54" dy="15.6">erro depois: ela volta</tspan></text><line x1="282" y1="175" x2="356" y2="175" stroke="#1f2937" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="602" y1="175" x2="676" y2="175" stroke="#1f2937" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="800" y1="272" x2="800" y2="346" stroke="#1f2937" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="676" y1="445" x2="604" y2="445" stroke="#1f2937" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="356" y1="445" x2="284" y2="445" stroke="#1f2937" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="160" y1="346" x2="160" y2="274" stroke="#1f2937" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="40" y="572" width="880" height="46" fill="#fef3c7" stroke="#d97706" stroke-width="1" rx="8" /><text x="480" y="601" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan x="480" dy="0.0">Regra: nenhuma ajuda de horizonte sai sem um critério que a máquina executa e a pessoa entende.</tspan></text></svg>