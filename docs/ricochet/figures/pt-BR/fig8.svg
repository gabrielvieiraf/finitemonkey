<svg xmlns="http://www.w3.org/2000/svg" width="976" height="577" viewBox="0 0 976 577" role="img" aria-label="O Finite Monkey como intervenção e instrumento"><title>O Finite Monkey como intervenção e instrumento</title><defs>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#f3dedb"/><line x1="0" y1="0" x2="0" y2="7" stroke="#a8372b" stroke-width="1.1" stroke-opacity="0.5"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#e9e1d3"/><circle cx="3" cy="3" r="0.9" fill="#7a5d2c" fill-opacity="0.55"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#121519"/></marker>
<marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8a929c"/></marker>
<marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#a8372b"/></marker>
<marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2a7552"/></marker>
</defs><rect x="0.0" y="0.0" width="976.0" height="576.8" fill="#fcfcfd" stroke="none" stroke-width="0"/><text x="24.0" y="34.0" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-size="20" fill="#121519" text-anchor="start" font-weight="600"><tspan x="24.0" dy="0.0">O Finite Monkey como intervenção e instrumento</tspan></text><line x1="24.0" y1="48.0" x2="952.0" y2="48.0" stroke="#e2e5e9" stroke-width="1"/><rect x="24.0" y="72.0" width="252.0" height="168.4" fill="#fcfcfd" stroke="#e2e5e9" stroke-width="1"/><rect x="24.0" y="72.0" width="252.0" height="3.0" fill="#6b7480" stroke="none" stroke-width="0"/><text x="38.0" y="98.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#6b7480" text-anchor="start" font-weight="700"><tspan x="38.0" dy="0.0">1. Sinais da sessão</tspan></text><line x1="38.0" y1="110.0" x2="262.0" y2="110.0" stroke="#e2e5e9" stroke-width="1"/><text x="38.0" y="130.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#121519" text-anchor="start" font-weight="400"><tspan x="38.0" dy="0.0">mesmo erro voltando</tspan><tspan x="38.0" dy="16.3">contrato sem progresso</tspan><tspan x="38.0" dy="16.3">perguntas de superfície</tspan><tspan x="38.0" dy="16.3">aceite rápido de diff grande</tspan><tspan x="38.0" dy="16.3">perfil por domínio</tspan></text><rect x="362.0" y="72.0" width="252.0" height="168.4" fill="#fcfcfd" stroke="#e2e5e9" stroke-width="1"/><rect x="362.0" y="72.0" width="252.0" height="3.0" fill="#7a5d2c" stroke="none" stroke-width="0"/><text x="376.0" y="98.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#7a5d2c" text-anchor="start" font-weight="700"><tspan x="376.0" dy="0.0">2. Hipótese de fronteira</tspan></text><line x1="376.0" y1="110.0" x2="600.0" y2="110.0" stroke="#e2e5e9" stroke-width="1"/><text x="376.0" y="130.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#121519" text-anchor="start" font-weight="400"><tspan x="376.0" dy="0.0">exploração: não sabe o</tspan><tspan x="376.0" dy="16.3">que pedir</tspan><tspan x="376.0" dy="16.3">julgamento: não consegue</tspan><tspan x="376.0" dy="16.3">avaliar o que recebeu</tspan><tspan x="376.0" dy="16.3">as duas: julgamento primeiro</tspan></text><rect x="700.0" y="72.0" width="252.0" height="168.4" fill="#fcfcfd" stroke="#e2e5e9" stroke-width="1"/><rect x="700.0" y="72.0" width="252.0" height="3.0" fill="#2c5597" stroke="none" stroke-width="0"/><text x="714.0" y="98.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#2c5597" text-anchor="start" font-weight="700"><tspan x="714.0" dy="0.0">3. Remédio</tspan></text><line x1="714.0" y1="110.0" x2="938.0" y2="110.0" stroke="#e2e5e9" stroke-width="1"/><text x="714.0" y="130.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#121519" text-anchor="start" font-weight="400"><tspan x="714.0" dy="0.0">exploração: pergunta só onde</tspan><tspan x="714.0" dy="16.3">as candidatas divergem</tspan><tspan x="714.0" dy="16.3">(A faz X, B faz Y)</tspan><tspan x="714.0" dy="16.3">julgamento: contrato de</tspan><tspan x="714.0" dy="16.3">comportamento, prova que</tspan><tspan x="714.0" dy="16.3">a pessoa consegue ler</tspan></text><rect x="700.0" y="304.4" width="252.0" height="168.4" fill="#fcfcfd" stroke="#e2e5e9" stroke-width="1"/><rect x="700.0" y="304.4" width="252.0" height="3.0" fill="#2a7552" stroke="none" stroke-width="0"/><text x="714.0" y="330.4" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#2a7552" text-anchor="start" font-weight="700"><tspan x="714.0" dy="0.0">4. Critério executável</tspan></text><line x1="714.0" y1="342.4" x2="938.0" y2="342.4" stroke="#e2e5e9" stroke-width="1"/><text x="714.0" y="362.4" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#121519" text-anchor="start" font-weight="400"><tspan x="714.0" dy="0.0">exemplos aprovados pela</tspan><tspan x="714.0" dy="16.3">pessoa, presos por hash</tspan><tspan x="714.0" dy="16.3">portão verde no estado exato</tspan><tspan x="714.0" dy="16.3">dos arquivos</tspan><tspan x="714.0" dy="16.3">critério que não pega defeito</tspan><tspan x="714.0" dy="16.3">plantado é decorativo</tspan></text><rect x="362.0" y="304.4" width="252.0" height="168.4" fill="#fcfcfd" stroke="#e2e5e9" stroke-width="1"/><rect x="362.0" y="304.4" width="252.0" height="3.0" fill="#2c5597" stroke="none" stroke-width="0"/><text x="376.0" y="330.4" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#2c5597" text-anchor="start" font-weight="700"><tspan x="376.0" dy="0.0">5. Registro</tspan></text><line x1="376.0" y1="342.4" x2="600.0" y2="342.4" stroke="#e2e5e9" stroke-width="1"/><text x="376.0" y="362.4" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#121519" text-anchor="start" font-weight="400"><tspan x="376.0" dy="0.0">índice de faixa cega</tspan><tspan x="376.0" dy="16.3">reparação depois do aceite</tspan><tspan x="376.0" dy="16.3">livro de conceitos</tspan><tspan x="376.0" dy="16.3">por domínio, só local</tspan></text><rect x="24.0" y="304.4" width="252.0" height="168.4" fill="#fcfcfd" stroke="#e2e5e9" stroke-width="1"/><rect x="24.0" y="304.4" width="252.0" height="3.0" fill="#2a7552" stroke="none" stroke-width="0"/><text x="38.0" y="330.4" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#2a7552" text-anchor="start" font-weight="700"><tspan x="38.0" dy="0.0">6. O andaime se retira</tspan></text><line x1="38.0" y1="342.4" x2="262.0" y2="342.4" stroke="#e2e5e9" stroke-width="1"/><text x="38.0" y="362.4" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#121519" text-anchor="start" font-weight="400"><tspan x="38.0" dy="0.0">previsão antes da mudança</tspan><tspan x="38.0" dy="16.3">em domínio novato</tspan><tspan x="38.0" dy="16.3">conceito demonstrado:</tspan><tspan x="38.0" dy="16.3">a exigência some</tspan><tspan x="38.0" dy="16.3">erro depois: ela volta</tspan></text><line x1="280.0" y1="156.2" x2="358.0" y2="156.2" stroke="#121519" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="618.0" y1="156.2" x2="696.0" y2="156.2" stroke="#121519" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="826.0" y1="244.4" x2="826.0" y2="300.4" stroke="#121519" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="696.0" y1="388.6" x2="618.0" y2="388.6" stroke="#121519" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="358.0" y1="388.6" x2="280.0" y2="388.6" stroke="#121519" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="150.0" y1="300.4" x2="150.0" y2="244.4" stroke="#121519" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="24.0" y="504.8" width="928.0" height="48.0" fill="#fbecc6" stroke="#b97d00" stroke-width="1"/><text x="488.0" y="534.8" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-size="14.5" fill="#121519" text-anchor="middle" font-weight="600"><tspan x="488.0" dy="0.0">Regra: nenhuma ajuda de horizonte sai sem um critério que a máquina executa e a pessoa entende.</tspan></text></svg>