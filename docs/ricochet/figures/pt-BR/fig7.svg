<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-label="Medição em três momentos no mesmo indivíduo"><title>Medição em três momentos no mesmo indivíduo</title><defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="8" height="8" fill="#fee2e2"/><line x1="0" y1="0" x2="0" y2="8" stroke="#dc2626" stroke-width="2.2"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs><rect x="0" y="0" width="960" height="570" fill="#ffffff" stroke="none" stroke-width="0" rx="0" /><text x="480.0" y="34" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan x="480.0" dy="0.0">Medição em três momentos no mesmo indivíduo</tspan></text><rect x="20" y="70" width="215" height="200" fill="#ffffff" stroke="#059669" stroke-width="1.8" rx="10" /><rect x="20" y="70" width="215" height="34" fill="#059669" stroke="none" stroke-width="0" rx="10" /><rect x="20" y="90" width="215" height="14" fill="#059669" stroke="none" stroke-width="0" rx="0" /><text x="127.5" y="93" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="127.5" dy="0.0">T0: linha de base</tspan></text><text x="34" y="128" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="34" dy="0.0">competência percebida P0</tspan><tspan x="34" dy="15.6">teto independente I0</tspan><tspan x="34" dy="15.6">discernimento D0</tspan><tspan x="34" dy="15.6">conhecimento do domínio</tspan><tspan x="34" dy="15.6">literacia sobre a ferramenta</tspan><tspan x="34" dy="15.6">dificuldade objetiva</tspan><tspan x="34" dy="15.6">e percebida, por item</tspan></text><line x1="238" y1="170" x2="251" y2="170" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="255" y="70" width="215" height="200" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" rx="10" /><rect x="255" y="70" width="215" height="34" fill="#2563eb" stroke="none" stroke-width="0" rx="10" /><rect x="255" y="90" width="215" height="14" fill="#2563eb" stroke="none" stroke-width="0" rx="0" /><text x="362.5" y="93" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="362.5" dy="0.0">Intervenção assistida</tspan></text><text x="269" y="128" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="269" dy="0.0">uso: aceite sem tentativa,</tspan><tspan x="269" dy="15.6">etapas delegadas</tspan><tspan x="269" dy="15.6">perguntas espontâneas</tspan><tspan x="269" dy="15.6">item a item: por que está</tspan><tspan x="269" dy="15.6">certo e quando deixa de</tspan><tspan x="269" dy="15.6">estar (proximal ou cega)</tspan><tspan x="269" dy="15.6">detecção de erro</tspan></text><line x1="473" y1="170" x2="486" y2="170" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="490" y="70" width="215" height="200" fill="#ffffff" stroke="#d97706" stroke-width="1.8" rx="10" /><rect x="490" y="70" width="215" height="34" fill="#d97706" stroke="none" stroke-width="0" rx="10" /><rect x="490" y="90" width="215" height="14" fill="#d97706" stroke="none" stroke-width="0" rx="0" /><text x="597.5" y="93" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="597.5" dy="0.0">T1: sem ferramenta</tspan></text><text x="504" y="128" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="504" dy="0.0">P1, I1, D1</tspan><tspan x="504" dy="15.6">índice de atribuição</tspan></text><line x1="708" y1="170" x2="721" y2="170" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="725" y="70" width="215" height="200" fill="#ffffff" stroke="#dc2626" stroke-width="1.8" rx="10" /><rect x="725" y="70" width="215" height="34" fill="#dc2626" stroke="none" stroke-width="0" rx="10" /><rect x="725" y="90" width="215" height="14" fill="#dc2626" stroke="none" stroke-width="0" rx="0" /><text x="832.5" y="93" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="832.5" dy="0.0">T2: retenção</tspan></text><text x="739" y="128" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="739" dy="0.0">I2, D2 e transferência</tspan><tspan x="739" dy="15.6">formas paralelas</tspan><tspan x="739" dy="15.6">perturbação: variante</tspan><tspan x="739" dy="15.6">deslocada e erro</tspan><tspan x="739" dy="15.6">deliberado da ferramenta</tspan><tspan x="739" dy="15.6">detecção e reparo</tspan></text><text x="717" y="296" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="bold"><tspan x="717" dy="0.0">≥ 1 semana</tspan></text><rect x="20" y="330" width="920" height="220" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1" rx="10" /><text x="40" y="360" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold"><tspan x="40" dy="0.0">Índices (modelados como variáveis latentes)</tspan></text><text x="40" y="392" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2563eb" text-anchor="start" font-weight="bold"><tspan x="40" dy="0.0">R = ΔP − ΔI</tspan></text><text x="250" y="392" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="250" dy="0.0">dissociação entre o que a pessoa acredita e o que consegue fazer</tspan></text><text x="40" y="422" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2563eb" text-anchor="start" font-weight="bold"><tspan x="40" dy="0.0">L = assistido − independente</tspan></text><text x="250" y="422" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="250" dy="0.0">largura da zona assistida</tspan></text><text x="40" y="452" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2563eb" text-anchor="start" font-weight="bold"><tspan x="40" dy="0.0">Bf = (assistido − D) / L</tspan></text><text x="250" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="250" dy="0.0">fração da zona que escapa ao julgamento</tspan></text><text x="40" y="482" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2563eb" text-anchor="start" font-weight="bold"><tspan x="40" dy="0.0">Rep</tspan></text><text x="250" y="482" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="250" dy="0.0">reparação sob perturbação, separada para itens proximais e cegos</tspan></text><text x="40" y="512" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2563eb" text-anchor="start" font-weight="bold"><tspan x="40" dy="0.0">M = assistido / referência</tspan></text><text x="250" y="512" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="250" dy="0.0">fração do desempenho de um operador de referência; baixo M = cegueira de horizonte</tspan></text></svg>