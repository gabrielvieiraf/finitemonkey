<svg xmlns="http://www.w3.org/2000/svg" width="980" height="480" viewBox="0 0 980 480" role="img" aria-label="Las cuatro memorias de un sistema con LLM"><title>Las cuatro memorias de un sistema con LLM</title><defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="8" height="8" fill="#fee2e2"/><line x1="0" y1="0" x2="0" y2="8" stroke="#dc2626" stroke-width="2.2"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
</defs><rect x="0" y="0" width="980" height="480" fill="#ffffff" stroke="none" stroke-width="0" rx="0" /><text x="490.0" y="36" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan x="490.0" dy="0.0">Las cuatro memorias de un sistema con LLM</tspan></text><rect x="30" y="90" width="230" height="230" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" rx="6" /><text x="44" y="116" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold"><tspan x="44" dy="0.0">Paramétrica</tspan></text><text x="44" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="44" dy="0.0">Pesos del modelo.</tspan><tspan x="44" dy="17.6">Hechos, patrones de</tspan><tspan x="44" dy="17.6">lenguaje y de razonamiento</tspan><tspan x="44" dy="17.6">hasta la fecha de corte.</tspan><tspan x="44" dy="17.6"></tspan><tspan x="44" dy="17.6">Cambia solo con un</tspan><tspan x="44" dy="17.6">nuevo ciclo de entrenamiento.</tspan></text><text x="145" y="345" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic"><tspan x="145" dy="0.0">fija durante la inferencia</tspan></text><rect x="320" y="90" width="270" height="230" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="6" /><text x="334" y="116" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold"><tspan x="334" dy="0.0">Contexto</tspan></text><text x="334" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="334" dy="0.0">Los tokens de una llamada:</tspan><tspan x="334" dy="17.6">pregunta, instrucciones,</tspan><tspan x="334" dy="17.6">notas recuperadas.</tspan><tspan x="334" dy="17.6"></tspan><tspan x="334" dy="17.6">El aprendizaje en contexto</tspan><tspan x="334" dy="17.6">ocurre aquí.</tspan></text><text x="455" y="345" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic"><tspan x="455" dy="0.0">desaparece al terminar la sesión</tspan></text><rect x="660" y="90" width="290" height="100" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" rx="6" /><text x="674" y="116" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold"><tspan x="674" dy="0.0">Episódica</tspan></text><text x="674" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="674" dy="0.0">Resumen de conversaciones</tspan><tspan x="674" dy="17.6">anteriores, guardado fuera</tspan><tspan x="674" dy="17.6">del modelo.</tspan></text><rect x="660" y="220" width="290" height="100" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" rx="6" /><text x="674" y="246" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold"><tspan x="674" dy="0.0">Externa</tspan></text><text x="674" y="270" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="674" dy="0.0">Documentos, bóveda de notas,</tspan><tspan x="674" dy="17.6">base vectorial, CLAUDE.md.</tspan></text><line x1="660" y1="140" x2="595" y2="175" stroke="#1f2937" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="660" y1="270" x2="595" y2="235" stroke="#1f2937" stroke-width="1.8" marker-end="url(#arrow)"/><text x="625" y="210" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal"><tspan x="625" dy="0.0">inyectado</tspan></text><line x1="320" y1="205" x2="265" y2="205" stroke="#1f2937" stroke-width="1.8" marker-end="url(#arrow)"/><text x="292" y="195" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal"><tspan x="292" dy="0.0">leído</tspan></text><path d="M320,380 L320,392 L950,392 L950,380" fill="none" stroke="#dc2626" stroke-width="2"/><text x="635" y="420" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold"><tspan x="635" dy="0.0">Donde realmente vive el "segundo cerebro"</tspan></text><text x="635" y="442" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal"><tspan x="635" dy="0.0">Texto guardado fuera del modelo y puesto en el contexto en cada llamada. El modelo no cambia.</tspan></text></svg>