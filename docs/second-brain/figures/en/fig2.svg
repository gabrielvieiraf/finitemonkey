<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="The note that rots and the claim that expires on its own"><title>The note that rots and the claim that expires on its own</title><defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="8" height="8" fill="#fee2e2"/><line x1="0" y1="0" x2="0" y2="8" stroke="#dc2626" stroke-width="2.2"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
</defs><rect x="0" y="0" width="1000" height="560" fill="#ffffff" stroke="none" stroke-width="0" rx="0" /><text x="500.0" y="36" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan x="500.0" dy="0.0">The note that rots and the claim that expires on its own</tspan></text><text x="230" y="78" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="bold"><tspan x="230" dy="0.0">Written</tspan></text><line x1="230" y1="88" x2="230" y2="520" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/><text x="500" y="78" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="bold"><tspan x="500" dy="0.0">The code changes</tspan></text><line x1="500" y1="88" x2="500" y2="520" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/><text x="770" y="78" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="bold"><tspan x="770" dy="0.0">Next session</tspan></text><line x1="770" y1="88" x2="770" y2="520" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/><text x="20" y="175" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold"><tspan x="20" dy="0.0">Plain</tspan><tspan x="20" dy="18.8">note</tspan></text><text x="20" y="395" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold"><tspan x="20" dy="0.0">Anchored</tspan><tspan x="20" dy="18.8">claim</tspan></text><rect x="150" y="120" width="165" height="105" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" rx="6" /><text x="164" y="146" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold"><tspan x="164" dy="0.0">Note in the vault</tspan></text><text x="164" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="164" dy="0.0">"Every authenticated</tspan><tspan x="164" dy="16.2">route goes through</tspan><tspan x="164" dy="16.2">middleware X."</tspan></text><rect x="420" y="120" width="165" height="105" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" rx="6" /><text x="434" y="146" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold"><tspan x="434" dy="0.0">Commit</tspan></text><text x="434" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="434" dy="0.0">A new route uses</tspan><tspan x="434" dy="16.2">another middleware.</tspan><tspan x="434" dy="16.2">The note doesn't know.</tspan></text><rect x="690" y="120" width="165" height="105" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" rx="6" /><text x="704" y="146" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold"><tspan x="704" dy="0.0">Injected into context</tspan></text><text x="704" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="704" dy="0.0">The agent follows the</tspan><tspan x="704" dy="16.2">note confidently and</tspan><tspan x="704" dy="16.2">gets it wrong.</tspan></text><line x1="317" y1="172" x2="418" y2="172" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="587" y1="172" x2="688" y2="172" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrowr)"/><text x="770" y="255" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="normal" font-style="italic"><tspan x="770" dy="0.0">nobody sees the error until it costs</tspan></text><rect x="150" y="340" width="165" height="105" fill="#d1fae5" stroke="#059669" stroke-width="1.5" rx="6" /><text x="164" y="366" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold"><tspan x="164" dy="0.0">Claim + anchor</tspan></text><text x="164" y="390" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="164" dy="0.0">Same text, bound to</tspan><tspan x="164" dy="16.2">auth.ts#requireUser</tspan><tspan x="164" dy="16.2">hash a3f9 · check: test</tspan></text><rect x="420" y="340" width="165" height="105" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" rx="6" /><text x="434" y="366" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold"><tspan x="434" dy="0.0">Stale</tspan></text><text x="434" y="390" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="434" dy="0.0">Hash is now b71c ≠ a3f9.</tspan><tspan x="434" dy="16.2">Leaves the context</tspan><tspan x="434" dy="16.2">on its own.</tspan></text><rect x="690" y="340" width="165" height="105" fill="#d1fae5" stroke="#059669" stroke-width="1.5" rx="6" /><text x="704" y="366" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold"><tspan x="704" dy="0.0">Revalidated</tspan></text><text x="704" y="390" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="704" dy="0.0">The check runs at the</tspan><tspan x="704" dy="16.2">gate. Pass: back with the</tspan><tspan x="704" dy="16.2">new hash. Fail: warning.</tspan></text><line x1="317" y1="392" x2="418" y2="392" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="587" y1="392" x2="688" y2="392" stroke="#059669" stroke-width="1.8" marker-end="url(#arrowg)"/><text x="770" y="475" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#059669" text-anchor="middle" font-weight="normal" font-style="italic"><tspan x="770" dy="0.0">staleness becomes computation</tspan></text></svg>