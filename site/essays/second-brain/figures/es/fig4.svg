<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-label="Escalera de recuperación: grep primero, modelo al final"><title>Escalera de recuperación: grep primero, modelo al final</title><defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="8" height="8" fill="#fee2e2"/><line x1="0" y1="0" x2="0" y2="8" stroke="#dc2626" stroke-width="2.2"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
</defs><rect x="0" y="0" width="980" height="520" fill="#ffffff" stroke="none" stroke-width="0" rx="0" /><text x="490.0" y="36" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan x="490.0" dy="0.0">Escalera de recuperación: grep primero, modelo al final</tspan></text><rect x="30" y="340" width="215" height="110" fill="#d1fae5" stroke="#059669" stroke-width="1.5" rx="6" /><text x="44" y="368" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold"><tspan x="44" dy="0.0">1. Grep y símbolo</tspan></text><text x="44" y="392" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="44" dy="0.0">Búsqueda léxica exacta.</tspan><tspan x="44" dy="16.2">Milisegundos,</tspan><tspan x="44" dy="16.2">sin modelo.</tspan></text><rect x="267" y="265" width="215" height="185" fill="#d1fae5" stroke="#059669" stroke-width="1.5" rx="6" /><text x="281" y="293" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold"><tspan x="281" dy="0.0">2. Mapa estructural</tspan></text><text x="281" y="317" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="281" dy="0.0">Archivos ordenados</tspan><tspan x="281" dy="16.2">por dependencia,</tspan><tspan x="281" dy="16.2">en caché por hash</tspan><tspan x="281" dy="16.2">del árbol.</tspan></text><rect x="504" y="190" width="215" height="260" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="6" /><text x="518" y="218" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold"><tspan x="518" dy="0.0">3. BM25 en afirmaciones</tspan></text><text x="518" y="242" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="518" dy="0.0">Solo afirmaciones válidas</tspan><tspan x="518" dy="16.2">y registros de decisión.</tspan><tspan x="518" dy="16.2">Devuelve fragmento con</tspan><tspan x="518" dy="16.2">ancla, no resumen.</tspan></text><rect x="741" y="115" width="215" height="335" fill="url(#hatch)" stroke="#dc2626" stroke-width="1.5" rx="6" /><rect x="749" y="123" width="199" height="118" fill="#ffffff" stroke="none" stroke-width="0" rx="4" /><text x="755" y="143" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold"><tspan x="755" dy="0.0">4. Embeddings o</tspan><tspan x="755" dy="18.8">búsqueda larga</tspan></text><text x="755" y="186" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="755" dy="0.0">Solo existe si un brazo</tspan><tspan x="755" dy="16.2">local muestra ganancia.</tspan><tspan x="755" dy="16.2">Costo alto en tokens</tspan><tspan x="755" dy="16.2">y tiempo.</tspan></text><line x1="30" y1="450" x2="950" y2="450" stroke="#1f2937" stroke-width="1.2"/><line x1="40" y1="480" x2="940" y2="480" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrowm)"/><text x="40" y="502" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="normal"><tspan x="40" dy="0.0">el costo por consulta y el riesgo de distractor crecen hacia la derecha</tspan></text><text x="950" y="80" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="end" font-weight="normal" font-style="italic"><tspan x="950" dy="0.0">cada peldaño registra si respondió y cuánto costó</tspan></text></svg>