text><line x1="202" y1="284" x2="318" y2="215" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrowm)"/><rect x="20" y="319" width="180" height="42" fill="#d1fae5" stroke="#059669" stroke-width="1.5" rx="6" /><text x="110" y="345" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal"><tspan x="110" dy="0.0">Compiled rule</tspan></text><line x1="202" y1="340" x2="318" y2="215" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrowm)"/><rect x="20" y="440" width="180" height="52" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" rx="6" /><text x="110" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal"><tspan x="110" dy="0.0">External content</tspan><tspan x="110" dy="16.2">(page, issue, tool)</tspan></text><rect x="250" y="440" width="170" height="52" fill="url(#hatch)" stroke="#dc2626" stroke-width="1.5" rx="6" /><rect x="258" y="448" width="154" height="36" fill="#ffffff" stroke="none" stroke-width="0" rx="4" /><text x="335" y="471" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan x="335" dy="0.0">Quarantine</tspan></text><line x1="202" y1="466" x2="248" y2="466" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrowr)"/><path d="M335,438 L335,300" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrowr)"/><text x="345" y="380" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#dc2626" text-anchor="start" font-weight="normal"><tspan x="345" dy="0.0">only with the</tspan><tspan x="345" dy="15.0">person's confirmation</tspan></text><rect x="320" y="160" width="220" height="135" fill="#ffffff" stroke="#1f2937" stroke-width="1.5" rx="6" /><text x="334" y="186" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold"><tspan x="334" dy="0.0">Claim</tspan></text><text x="334" y="210" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="334" dy="0.0">anchor: path, symbol,</tspan><tspan x="334" dy="16.2">hash of the span</tspan><tspan x="334" dy="16.2">kind: check or prose</tspan><tspan x="334" dy="16.2">origin and two times</tspan></text><rect x="600" y="160" width="170" height="100" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="6" /><text x="614" y="186" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold"><tspan x="614" dy="0.0">Verification</tspan></text><text x="614" y="210" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="614" dy="0.0">check runs at the gate;</tspan><tspan x="614" dy="16.2">prose stays marked</tspan><tspan x="614" dy="16.2">as unverified</tspan></text><line x1="542" y1="210" x2="598" y2="210" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="820" y="140" width="160" height="140" fill="#d1fae5" stroke="#059669" stroke-width="1.5" rx="6" /><text x="834" y="166" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold"><tspan x="834" dy="0.0">Context</tspan></text><text x="834" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="834" dy="0.0">valid only,</tspan><tspan x="834" dy="16.2">within the</tspan><tspan x="834" dy="16.2">budget,</tspan><tspan x="834" dy="16.2">measured by</tspan><tspan x="834" dy="16.2">A/B arm</tspan></text><line x1="772" y1="210" x2="818" y2="210" stroke="#059669" stroke-width="1.8" marker-end="url(#arrowg)"/><rect x="600" y="330" width="170" height="90" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" rx="6" /><text x="614" y="356" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold"><tspan x="614" dy="0.0">Stale</tspan></text><text x="614" y="380" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="614" dy="0.0">out of context;</tspan><tspan x="614" dy="16.2">dependents fall</tspan><tspan x="614" dy="16.2">with it</tspan></text><path d="M685,328 L685,262" fill="none" stroke="#d97706" stroke-width="1.6" marker-end="url(#arrow)"/><text x="695" y="300" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#d97706" text-anchor="start" font-weight="normal"><tspan x="695" dy="0.0">revalidate</tspan></text><path d="M900,282 L900,375 L772,375" fill="none" stroke="#d97706" stroke-width="1.6" marker-end="url(#arrow)"/><text x="905" y="335" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#d97706" text-anchor="start" font-weight="normal"><tspan x="905" dy="0.0">code</tspan><tspan x="905" dy="15.0">changed</tspan></text><rect x="600" y="480" width="380" height="110" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" rx="6" /><text x="614" y="506" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold"><tspan x="614" dy="0.0">Derived text (cache)</tspan></text><text x="614" y="530" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="614" dy="0.0">map, module summaries, handoff:</tspan><tspan x="614" dy="16.2">keyed by the hash of its inputs and rebuilt</tspan><tspan x="614" dy="16.2">when they change</tspan></text><path d="M900,282 L900,300" fill="none" stroke="#9ca3af" stroke-width="0"/><path d="M650,478 C560,520 470,420 430,300" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrowm)"/><line x1="509" y1="438" x2="533" y2="462" stroke="#dc2626" stroke-width="3"/><line x1="533" y1="438" x2="509" y2="462" stroke="#dc2626" stroke-width="3"/><text x="521" y="490" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="normal"><tspan x="521" dy="0.0">never comes back</tspan><tspan x="521" dy="15.0">as a source</tspan></text></svg>