<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-label="Life cycle of a claim in Finite Monkey"><title>Life cycle of a claim in Finite Monkey</title><defs>
