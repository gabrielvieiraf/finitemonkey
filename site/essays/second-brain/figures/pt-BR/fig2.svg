<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="A nota que apodrece e a afirmação que vence sozinha"><title>A nota que apodrece e a afirmação que vence sozinha</title><defs>
