</defs><rect x="0" y="0" width="1000" height="560" fill="#ffffff" stroke="none" stroke-width="0" rx="0" /><text x="500.0" y="36" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan x="500.0" dy="0.0">A nota que apodrece e a afirmação que vence sozinha</tspan></text><text x="230" y="78" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="bold"><tspan x="230" dy="0.0">Registro</tspan></text><line x1="230" y1="88" x2="230" y2="520" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/><text x="500" y="78" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="bold"><tspan x="500" dy="0.0">O código muda</tspan></text><line x1="500" y1="88" x2="500" y2="520" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/><text x="770" y="78" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="bold"><tspan x="770" dy="0.0">Sessão seguinte</tspan></text><line x1="770" y1="88" x2="770" y2="520" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/><text x="20" y="175" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold"><tspan x="20" dy="0.0">Nota</tspan><tspan x="20" dy="18.8">comum</tspan></text><text x="20" y="395" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold"><tspan x="20" dy="0.0">Afirmação</tspan><tspan x="20" dy="18.8">ancorada</tspan></text><rect x="150" y="120" width="165" height="105" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" rx="6" /><text x="164" y="146" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold"><tspan x="164" dy="0.0">Nota no cofre</tspan></text><text x="164" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="164" dy="0.0">"Toda rota autenticada</tspan><tspan x="164" dy="16.2">passa pelo middleware</tspan><tspan x="164" dy="16.2">X."</tspan></text><rect x="420" y="120" width="165" height="105" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" rx="6" /><text x="434" y="146" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold"><tspan x="434" dy="0.0">Commit</tspan></text><text x="434" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="434" dy="0.0">Rota nova usa outro</tspan><tspan x="434" dy="16.2">middleware. A nota</tspan><tspan x="434" dy="16.2">não sabe.</tspan></text><rect x="690" y="120" width="165" height="105" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" rx="6" /><text x="704" y="146" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold"><tspan x="704" dy="0.0">Injetada no contexto</tspan></text><text x="704" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="704" dy="0.0">O agente segue a nota</tspan><tspan x="704" dy="16.2">com confiança e erra.</tspan></text><line x1="317" y1="172" x2="418" y2="172" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="587" y1="172" x2="688" y2="172" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrowr)"/><text x="770" y="255" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="normal" font-style="italic"><tspan x="770" dy="0.0">ninguém vê o erro até ele custar</tspan></text><rect x="150" y="340" width="165" height="105" fill="#d1fae5" stroke="#059669" stroke-width="1.5" rx="6" /><text x="164" y="366" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold"><tspan x="164" dy="0.0">Afirmação + âncora</tspan></text><text x="164" y="390" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="164" dy="0.0">Mesmo texto, presa a</tspan><tspan x="164" dy="16.2">auth.ts#requireUser</tspan><tspan x="164" dy="16.2">hash a3f9 · check: teste</tspan></text><rect x="420" y="340" width="165" height="105" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" rx="6" /><text x="434" y="366" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold"><tspan x="434" dy="0.0">Obsoleta</tspan></text><text x="434" y="390" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="434" dy="0.0">Hash agora b71c ≠ a3f9.</tspan><tspan x="434" dy="16.2">Sai do contexto</tspan><tspan x="434" dy="16.2">sozinha.</tspan></text><rect x="690" y="340" width="165" height="105" fill="#d1fae5" stroke="#059669" stroke-width="1.5" rx="6" /><text x="704" y="366" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold"><tspan x="704" dy="0.0">Revalidada</tspan></text><text x="704" y="390" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="704" dy="0.0">O check roda no gate.</tspan><tspan x="704" dy="16.2">Passou: volta com o</tspan><tspan x="704" dy="16.2">hash novo. Falhou: aviso.</tspan></text><line x1="317" y1="392" x2="418" y2="392" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="587" y1="392" x2="688" y2="392" stroke="#059669" stroke-width="1.8" marker-end="url(#arrowg)"/><text x="770" y="475" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#059669" text-anchor="middle" font-weight="normal" font-style="italic"><tspan x="770" dy="0.0">a obsolescência vira computação</tspan></text></svg>