 Mono', monospace" font-size="12.5" fill="#2c5597" text-anchor="start" font-weight="700"><tspan x="276.0" dy="0.0">Intervenção assistida</tspan></text><line x1="276.0" y1="110.0" x2="462.0" y2="110.0" stroke="#e2e5e9" stroke-width="1"/><text x="276.0" y="130.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.41" fill="#121519" text-anchor="start" font-weight="400"><tspan x="276.0" dy="0.0">uso: aceite sem tentativa,</tspan><tspan x="276.0" dy="16.2">etapas delegadas</tspan><tspan x="276.0" dy="16.2">perguntas espontâneas</tspan><tspan x="276.0" dy="16.2">item a item: por que está</tspan><tspan x="276.0" dy="16.2">certo e quando deixa de</tspan><tspan x="276.0" dy="16.2">estar (proximal ou cega)</tspan><tspan x="276.0" dy="16.2">detecção de erro</tspan></text><line x1="479.0" y1="164.4" x2="496.0" y2="164.4" stroke="#121519" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="500.0" y="72.0" width="214.0" height="184.8" fill="#fcfcfd" stroke="#e2e5e9" stroke-width="1"/><rect x="500.0" y="72.0" width="214.0" height="3.0" fill="#7a5d2c" stroke="none" stroke-width="0"/><text x="514.0" y="98.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#7a5d2c" text-anchor="start" font-weight="700"><tspan x="514.0" dy="0.0">T1: sem ferramenta</tspan></text><line x1="514.0" y1="110.0" x2="700.0" y2="110.0" stroke="#e2e5e9" stroke-width="1"/><text x="514.0" y="130.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#121519" text-anchor="start" font-weight="400"><tspan x="514.0" dy="0.0">P1, I1, D1</tspan><tspan x="514.0" dy="16.3">índice de atribuição</tspan></text><line x1="717.0" y1="164.4" x2="734.0" y2="164.4" stroke="#121519" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="738.0" y="72.0" width="214.0" height="184.8" fill="#fcfcfd" stroke="#e2e5e9" stroke-width="1"/><rect x="738.0" y="72.0" width="214.0" height="3.0" fill="#a8372b" stroke="none" stroke-width="0"/><text x="752.0" y="98.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#a8372b" text-anchor="start" font-weight="700"><tspan x="752.0" dy="0.0">T2: retenção</tspan></text><line x1="752.0" y1="110.0" x2="938.0" y2="110.0" stroke="#e2e5e9" stroke-width="1"/><text x="752.0" y="130.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#121519" text-anchor="start" font-weight="400"><tspan x="752.0" dy="0.0">I2, D2 e transferência</tspan><tspan x="752.0" dy="16.3">formas paralelas</tspan><tspan x="752.0" dy="16.3">perturbação: variante</tspan><tspan x="752.0" dy="16.3">deslocada e erro</tspan><tspan x="752.0" dy="16.3">deliberado da ferramenta</tspan><tspan x="752.0" dy="16.3">detecção e reparo</tspan></text><text x="726.0" y="278.8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#5d6570" text-anchor="middle" font-weight="700"><tspan x="726.0" dy="0.0">≥ 1 semana</tspan></text><line x1="24.0" y1="306.8" x2="952.0" y2="306.8" stroke="#121519" stroke-width="1"/><text x="24.0" y="332.8" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-size="15" fill="#121519" text-anchor="start" font-weight="600"><tspan x="24.0" dy="0.0">Índices (modelados como variáveis latentes)</tspan></text><text x="24.0" y="364.8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#2c5597" text-anchor="start" font-weight="700"><tspan x="24.0" dy="0.0">R = ΔP − ΔI</tspan></text><text x="269.0" y="364.8" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-size="14" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="269.0" dy="0.0">dissociação entre o que a pessoa acredita e o que consegue fazer</tspan></text><line x1="24.0" y1="376.8" x2="952.0" y2="376.8" stroke="#eceef1" stroke-width="1"/><text x="24.0" y="396.8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#2c5597" text-anchor="start" font-weight="700"><tspan x="24.0" dy="0.0">L = assistido − independente</tspan></text><text x="269.0" y="396.8" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-size="14" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="269.0" dy="0.0">largura da zona assistida</tspan></text><line x1="24.0" y1="408.8" x2="952.0" y2="408.8" stroke="#eceef1" stroke-width="1"/><text x="24.0" y="428.8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#2c5597" text-anchor="start" font-weight="700"><tspan x="24.0" dy="0.0">Bf = (assistido − D) / L</tspan></text><text x="269.0" y="428.8" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-size="14" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="269.0" dy="0.0">fração da zona que escapa ao julgamento</tspan></text><line x1="24.0" y1="440.8" x2="952.0" y2="440.8" stroke="#eceef1" stroke-width="1"/><text x="24.0" y="460.8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#2c5597" text-anchor="start" font-weight="700"><tspan x="24.0" dy="0.0">Rep</tspan></text><text x="269.0" y="460.8" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-size="14" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="269.0" dy="0.0">reparação sob perturbação, separada para itens proximais e cegos</tspan></text><line x1="24.0" y1="472.8" x2="952.0" y2="472.8" stroke="#eceef1" stroke-width="1"/><text x="24.0" y="492.8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#2c5597" text-anchor="start" font-weight="700"><tspan x="24.0" dy="0.0">M = assistido / referência</tspan></text><text x="269.0" y="492.8" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-size="14" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="269.0" dy="0.0">fração do desempenho de um operador de referência; baixo M = cegueira de horizonte</tspan></text><line x1="24.0" y1="504.8" x2="952.0" y2="504.8" stroke="#eceef1" stroke-width="1"/></svg>