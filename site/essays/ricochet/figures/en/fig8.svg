</defs><rect x="0.0" y="0.0" width="976.0" height="576.8" fill="#fcfcfd" stroke="none" stroke-width="0"/><text x="24.0" y="34.0" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-size="20" fill="#121519" text-anchor="start" font-weight="600"><tspan x="24.0" dy="0.0">Finite Monkey as intervention and instrument</tspan></text><line x1="24.0" y1="48.0" x2="952.0" y2="48.0" stroke="#e2e5e9" stroke-width="1"/><rect x="24.0" y="72.0" width="252.0" height="168.4" fill="#fcfcfd" stroke="#e2e5e9" stroke-width="1"/><rect x="24.0" y="72.0" width="252.0" height="3.0" fill="#6b7480" stroke="none" stroke-width="0"/><text x="38.0" y="98.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#6b7480" text-anchor="start" font-weight="700"><tspan x="38.0" dy="0.0">1. Session signals</tspan></text><line x1="38.0" y1="110.0" x2="262.0" y2="110.0" stroke="#e2e5e9" stroke-width="1"/><text x="38.0" y="130.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#121519" text-anchor="start" font-weight="400"><tspan x="38.0" dy="0.0">same error coming back</tspan><tspan x="38.0" dy="16.3">contract not moving</tspan><tspan x="38.0" dy="16.3">surface questions</tspan><tspan x="38.0" dy="16.3">fast approval of a large diff</tspan><tspan x="38.0" dy="16.3">per-domain profile</tspan></text><rect x="362.0" y="72.0" width="252.0" height="168.4" fill="#fcfcfd" stroke="#e2e5e9" stroke-width="1"/><rect x="362.0" y="72.0" width="252.0" height="3.0" fill="#7a5d2c" stroke="none" stroke-width="0"/><text x="376.0" y="98.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#7a5d2c" text-anchor="start" font-weight="700"><tspan x="376.0" dy="0.0">2. Boundary hypothesis</tspan></text><line x1="376.0" y1="110.0" x2="600.0" y2="110.0" stroke="#e2e5e9" stroke-width="1"/><text x="376.0" y="130.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#121519" text-anchor="start" font-weight="400"><tspan x="376.0" dy="0.0">exploration: does not know</tspan><tspan x="376.0" dy="16.3">what to ask</tspan><tspan x="376.0" dy="16.3">judgment: cannot evaluate</tspan><tspan x="376.0" dy="16.3">what came back</tspan><tspan x="376.0" dy="16.3">both: judgment first</tspan></text><rect x="700.0" y="72.0" width="252.0" height="168.4" fill="#fcfcfd" stroke="#e2e5e9" stroke-width="1"/><rect x="700.0" y="72.0" width="252.0" height="3.0" fill="#2c5597" stroke="none" stroke-width="0"/><text x="714.0" y="98.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#2c5597" text-anchor="start" font-weight="700"><tspan x="714.0" dy="0.0">3. Remedy</tspan></text><line x1="714.0" y1="110.0" x2="938.0" y2="110.0" stroke="#e2e5e9" stroke-width="1"/><text x="714.0" y="130.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#121519" text-anchor="start" font-weight="400"><tspan x="714.0" dy="0.0">exploration: ask only where</tspan><tspan x="714.0" dy="16.3">candidates diverge</tspan><tspan x="714.0" dy="16.3">(A does X, B does Y)</tspan><tspan x="714.0" dy="16.3">judgment: behavior contract,</tspan><tspan x="714.0" dy="16.3">proof the person</tspan><tspan x="714.0" dy="16.3">can read</tspan></text><rect x="700.0" y="304.4" width="252.0" height="168.4" fill="#fcfcfd" stroke="#e2e5e9" stroke-width="1"/><rect x="700.0" y="304.4" width="252.0" height="3.0" fill="#2a7552" stroke="none" stroke-width="0"/><text x="714.0" y="330.4" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#2a7552" text-anchor="start" font-weight="700"><tspan x="714.0" dy="0.0">4. Executable criterion</tspan></text><line x1="714.0" y1="342.4" x2="938.0" y2="342.4" stroke="#e2e5e9" stroke-width="1"/><text x="714.0" y="362.4" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#121519" text-anchor="start" font-weight="400"><tspan x="714.0" dy="0.0">examples the person approved,</tspan><tspan x="714.0" dy="16.3">locked by hash</tspan><tspan x="714.0" dy="16.3">green gate on the exact</tspan><tspan x="714.0" dy="16.3">file state</tspan><tspan x="714.0" dy="16.3">a criterion that misses planted</tspan><tspan x="714.0" dy="16.3">bugs is decorative</tspan></text><rect x="362.0" y="304.4" width="252.0" height="168.4" fill="#fcfcfd" stroke="#e2e5e9" stroke-width="1"/><rect x="362.0" y="304.4" width="252.0" height="3.0" fill="#2c5597" stroke="none" stroke-width="0"/><text x="376.0" y="330.4" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#2c5597" text-anchor="start" font-weight="700"><tspan x="376.0" dy="0.0">5. Record</tspan></text><line x1="376.0" y1="342.4" x2="600.0" y2="342.4" stroke="#e2e5e9" stroke-width="1"/><text x="376.0" y="362.4" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#121519" text-anchor="start" font-weight="400"><tspan x="376.0" dy="0.0">blind band index</tspan><tspan x="376.0" dy="16.3">repair after approval</tspan><tspan x="376.0" dy="16.3">concept book</tspan><tspan x="376.0" dy="16.3">per domain, local only</tspan></text><rect x="24.0" y="304.4" width="252.0" height="168.4" fill="#fcfcfd" stroke="#e2e5e9" stroke-width="1"/><rect x="24.0" y="304.4" width="252.0" height="3.0" fill="#2a7552" stroke="none" stroke-width="0"/><text x="38.0" y="330.4" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#2a7552" text-anchor="start" font-weight="700"><tspan x="38.0" dy="0.0">6. The scaffold withdraws</tspan></text><line x1="38.0" y1="342.4" x2="262.0" y2="342.4" stroke="#e2e5e9" stroke-width="1"/><text x="38.0" y="362.4" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#121519" text-anchor="start" font-weight="400"><tspan x="38.0" dy="0.0">prediction before the change</tspan><tspan x="38.0" dy="16.3">in a novice domain</tspan><tspan x="38.0" dy="16.3">concept demonstrated:</tspan><tspan x="38.0" dy="16.3">the prompt fades</tspan><tspan x="38.0" dy="16.3">later error: it returns</tspan></text><line x1="280.0" y1="156.2" x2="358.0" y2="156.2" stroke="#121519" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="618.0" y1="156.2" x2="696.0" y2="156.2" stroke="#121519" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="826.0" y1="244.4" x2="826.0" y2="300.4" stroke="#121519" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="696.0" y1="388.6" x2="618.0" y2="388.6" stroke="#121519" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="358.0" y1="388.6" x2="280.0" y2="388.6" stroke="#121519" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="150.0" y1="300.4" x2="150.0" y2="244.4" stroke="#121519" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="24.0" y="504.8" width="928.0" height="48.0" fill="#fbecc6" stroke="#b97d00" stroke-width="1"/><text x="488.0" y="534.8" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-size="14.5" fill="#121519" text-anchor="middle" font-weight="600"><tspan x="488.0" dy="0.0">Rule: no horizon help goes out without a criterion the machine runs and the person understands.</tspan></text></svg>