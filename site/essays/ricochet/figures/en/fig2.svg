="1" stroke-opacity="0.35"/><line x1="256.9" y1="146.8" x2="426.9" y2="146.8" stroke="#121519" stroke-width="1" stroke-dasharray="2 3" stroke-opacity="0.18"/><rect x="256.9" y="98.4" width="170.0" height="457.6" fill="none" stroke="#121519" stroke-width="0.6" stroke-opacity="0.35"/><line x1="246.9" y1="98.4" x2="256.9" y2="98.4" stroke="#121519" stroke-width="1"/><text x="240.9" y="102.4" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#121519" text-anchor="end" font-weight="400"><tspan x="240.9" dy="0.0">technological ceiling</tspan></text><line x1="246.9" y1="195.2" x2="256.9" y2="195.2" stroke="#121519" stroke-width="1"/><text x="240.9" y="199.2" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#121519" text-anchor="end" font-weight="400"><tspan x="240.9" dy="0.0">assisted ceiling</tspan><tspan x="240.9" dy="15.5">(exploration boundary)</tspan></text><line x1="246.9" y1="336.0" x2="256.9" y2="336.0" stroke="#121519" stroke-width="1"/><text x="240.9" y="340.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#121519" text-anchor="end" font-weight="400"><tspan x="240.9" dy="0.0">discernment ceiling</tspan><tspan x="240.9" dy="15.5">(judgment boundary)</tspan></text><line x1="246.9" y1="459.2" x2="256.9" y2="459.2" stroke="#121519" stroke-width="1"/><text x="240.9" y="463.2" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#121519" text-anchor="end" font-weight="400"><tspan x="240.9" dy="0.0">independent ceiling</tspan></text><path d="M 62 196.2 L 54 196.2 L 54 458.2 L 62 458.2" fill="none" stroke="#121519" stroke-width="1.2"/><g transform="translate(46,327.2) rotate(-90)"><text x="0.0" y="0.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#121519" text-anchor="middle" font-weight="700"><tspan x="0.0" dy="0.0">assisted zone</tspan></text></g><path d="M 429.86 99.4 L 434.86 99.4 L 434.86 194.2 L 429.86 194.2" fill="none" stroke="#6b7480" stroke-width="1.2"/><path d="M 434.86 146.8 L 476.86 121.8" fill="none" stroke="#6b7480" stroke-width="0.8" stroke-opacity="0.6"/><text x="482.9" y="125.8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#6b7480" text-anchor="start" font-weight="700"><tspan x="482.9" dy="0.0">Beyond the horizon: the tool could</tspan><tspan x="482.9" dy="14.9">give it, but the person does not know to ask</tspan></text><rect x="494.9" y="149.1" width="10.0" height="10.0" fill="#eff1f4" stroke="#8a929c" stroke-width="0.6"/><text x="510.9" y="158.1" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="510.9" dy="0.0">out of reach</tspan></text><rect x="494.9" y="165.6" width="10.0" height="10.0" fill="#e3e6eb" stroke="#8a929c" stroke-width="0.6"/><text x="510.9" y="174.6" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="510.9" dy="0.0">would recognize if shown</tspan></text><path d="M 429.86 196.2 L 434.86 196.2 L 434.86 324.0 L 429.86 324.0" fill="none" stroke="#a8372b" stroke-width="1.2"/><path d="M 434.86 260.1 L 476.86 235.1" fill="none" stroke="#a8372b" stroke-width="0.8" stroke-opacity="0.6"/><text x="482.9" y="239.1" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#a8372b" text-anchor="start" font-weight="700"><tspan x="482.9" dy="0.0">Blind band: the person gets it,</tspan><tspan x="482.9" dy="14.9">but neither produces nor judges it</tspan></text><rect x="494.9" y="262.5" width="10.0" height="10.0" fill="url(#hatch)" stroke="#8a929c" stroke-width="0.6"/><text x="510.9" y="271.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="510.9" dy="0.0">receives without criterion</tspan></text><rect x="494.9" y="279.0" width="10.0" height="10.0" fill="url(#dots)" stroke="#8a929c" stroke-width="0.6"/><text x="510.9" y="288.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="510.9" dy="0.0">receives with criterion</tspan></text><path d="M 434.86 336.0 L 476.86 335.0" fill="none" stroke="#6b4a8c" stroke-width="0.8" stroke-opacity="0.6"/><rect x="482.9" y="330.0" width="10.0" height="10.0" fill="#d9c6e8" stroke="#8a929c" stroke-width="0.6"/><text x="498.9" y="339.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#6b4a8c" text-anchor="start" font-weight="700"><tspan x="498.9" dy="0.0">unstable boundary</tspan></text><path d="M 429.86 348.0 L 434.86 348.0 L 434.86 458.2 L 429.86 458.2" fill="none" stroke="#2c5597" stroke-width="1.2"/><path d="M 434.86 403.1 L 476.86 378.1" fill="none" stroke="#2c5597" stroke-width="0.8" stroke-opacity="0.6"/><text x="482.9" y="382.1" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#2c5597" text-anchor="start" font-weight="700"><tspan x="482.9" dy="0.0">Proximal band: cannot produce</tspan><tspan x="482.9" dy="14.9">alone, but still judges</tspan></text><rect x="494.9" y="405.5" width="10.0" height="10.0" fill="#e5ecf8" stroke="#8a929c" stroke-width="0.6"/><text x="510.9" y="414.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="510.9" dy="0.0">detects without explaining</tspan></text><rect x="494.9" y="422.0" width="10.0" height="10.0" fill="#cddbf2" stroke="#8a929c" stroke-width="0.6"/><text x="510.9" y="431.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="510.9" dy="0.0">judges and explains</tspan></text><path d="M 429.86 460.2 L 434.86 460.2 L 434.86 555.0 L 429.86 555.0" fill="none" stroke="#2a7552" stroke-width="1.2"/><path d="M 434.86 507.6 L 476.86 490.6" fill="none" stroke="#2a7552" stroke-width="0.8" stroke-opacity="0.6"/><text x="482.9" y="494.6" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#2a7552" text-anchor="start" font-weight="700"><tspan x="482.9" dy="0.0">Independent competence</tspan></text><rect x="494.9" y="503.1" width="10.0" height="10.0" fill="#e4f2ea" stroke="#8a929c" stroke-width="0.6"/><text x="510.9" y="512.1" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="510.9" dy="0.0">redoes it in a known context</tspan></text><rect x="494.9" y="519.6" width="10.0" height="10.0" fill="#cfe7da" stroke="#8a929c" stroke-width="0.6"/><text x="510.9" y="528.6" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="510.9" dy="0.0">does it and transfers it</tspan></text></svg>