 text-anchor="start" font-weight="400"><tspan x="896.9" dy="0.0">redoes it in a known context</tspan></text><rect x="880.9" y="239.0" width="10.0" height="10.0" fill="#cfe7da" stroke="#8a929c" stroke-width="0.6"/><text x="896.9" y="248.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5d6570" text-anchor="start" font-weight="400"><tspan x="896.9" dy="0.0">does it and transfers it</tspan></text></svg>